    ["ไข่และนม", "--c-dairy"],
    ["เต้าหู้และถั่ว", "--c-tofu"],
    ["ผัก", "--c-veg"],
    ["สมุนไพรและเครื่องเทศ", "--c-herb"],
    ["ผลไม้", "--c-fruit"],
    ["ข้าวและเส้น", "--c-grain"],
    ["เครื่องปรุง", "--c-season"],
    ["อื่นๆ", "--c-other"],
  ];
  const TYPE_COLOR = Object.fromEntries(TYPE_ORDER);
  const OTHER = "อื่นๆ";

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    miss: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5"/><path d="M12 16h.01"/></svg>',
    skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    bowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
    emptyBowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5" stroke-dasharray="1.6 1.6"/></svg>',
  };
  const ALL = "ทั้งหมด";

  const state = {
    raw: { recipes: null, rows: null, ingredients: null },
    updatedAt: null,
    loading: true,
    notice: null, // {code, text, action?}
    view: "pantry",
    menuSearch: "",
    cat: "ทั้งหมด",
    menuTab: "ready", // ready | almost | all
    selected: new Set(loadSelected()),
    counts: new Map(loadCounts()), // ingredient → {count, unit}; only for things in `selected` that are counted
    serverPantry: false, // true once the server answered with a kitchen (new Code.js deployed)
    countFor: null, // count sheet: {name, on, n, unit, units}
    cook: null, // ทำแล้ว sheet: {name, rows}
    plan: new Set(loadPlan()),
    bought: new Set(loadBought()),
    freq: loadFreq(),
    openRecipe: null,
    edit: null, // recipe editor draft (see startEdit), null = showing the recipe
    // add sheet: ticks stay in `pending` until "เสร็จ"
    adding: false,
    addSearch: "",
    addOpen: null,
    pending: new Set(),
  };

  // ---------- storage (per-viewer convenience only) ----------
  function loadSelected() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch { return []; }
  }
  function saveSelected() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...state.selected])); } catch {}
  }
  function loadPlan() {
    try { return JSON.parse(localStorage.getItem(PLAN_KEY) || "[]"); } catch { return []; }
  }
  function savePlan() {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify([...state.plan])); } catch {}
  }
  function loadBought() {
    try { return JSON.parse(localStorage.getItem(BOUGHT_KEY) || "[]"); } catch { return []; }
  }
  function saveBought() {
    try { localStorage.setItem(BOUGHT_KEY, JSON.stringify([...state.bought])); } catch {}
  }
  function loadFreq() {
    try { const f = JSON.parse(localStorage.getItem(FREQ_KEY) || "{}"); return f && typeof f === "object" ? f : {}; } catch { return {}; }
  }
  const freqOf = (n) => (Object.prototype.hasOwnProperty.call(state.freq, n) ? Number(state.freq[n]) || 0 : 0);
  function bumpFreq(names) {
    for (const n of names) state.freq[n] = freqOf(n) + 1;
    try { localStorage.setItem(FREQ_KEY, JSON.stringify(state.freq)); } catch {}
  }
  function loadCounts() {
    try {
      const o = JSON.parse(localStorage.getItem(COUNT_KEY) || "{}");
      return Object.entries(o).filter(([, v]) => v && Number.isFinite(v.count));
    } catch { return []; }
  }
  function saveCounts() {
    try { localStorage.setItem(COUNT_KEY, JSON.stringify(Object.fromEntries(state.counts))); } catch {}
  }

  // ---------- kitchen store: every change to selected/counts goes through here ----------
  // Each change becomes one op {name, have, count, unit}; ops wait in `pending` (one per ingredient, newest wins)
  // and are sent to savePantry in batches. The server answers with the whole kitchen; pending ops are laid on top.
  const pending = new Map(loadPending());
  function loadPending() {
    try { return Object.entries(JSON.parse(localStorage.getItem(PENDING_KEY) || "{}")); } catch { return []; }
  }
  function savePending() {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(Object.fromEntries(pending))); } catch {}
  }
  function applyOp(op) {
    if (op.have) {
      state.selected.add(op.name);
      if (op.count != null) state.counts.set(op.name, { count: op.count, unit: op.unit || "" });
      else state.counts.delete(op.name);
    } else {
      state.selected.delete(op.name);
      state.counts.delete(op.name);
    }
  }
  // have = in the kitchen or not; count = number or null (not counted); a change of "have" alone keeps the count
  function setHave(name, have, count = have ? state.counts.get(name)?.count ?? null : null, unit = state.counts.get(name)?.unit || "") {
    const op = { name, have, count: have && count != null ? Math.max(0, Math.round(count * 100) / 100) : null, unit: have && count != null ? unit : "" };
    applyOp(op);
    pending.set(name, op);
    saveSelected(); saveCounts(); savePending();
    scheduleSync();
  }
  const snapshot = () => ({ selected: new Set(state.selected), counts: new Map(state.counts) });
  function restore(s) { // undo: put the kitchen back as it was, as ops
    for (const n of new Set([...state.selected, ...s.selected])) {
      const c = s.counts.get(n);
      setHave(n, s.selected.has(n), c ? c.count : null, c ? c.unit : "");
    }
  }
  function applyServerPantry(list) {
    state.selected = new Set(list.map((p) => p.name));
    state.counts = new Map(list.filter((p) => p.count != null).map((p) => [p.name, { count: p.count, unit: p.unit }]));
    for (const op of pending.values()) applyOp(op);
    saveSelected(); saveCounts();
  }
  let syncTimer = null, syncing = false;
  function scheduleSync(ms = 800) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncPantry, ms);
  }
  async function syncPantry() {
    if (syncing || !pending.size || !state.serverPantry) return;
    syncing = true;
    const sent = new Map(pending);
    try {
      const res = await api("savePantry", { ops: [...sent.values()] });
      for (const [n, op] of sent) if (pending.get(n) === op) pending.delete(n); // keep ops changed while sending
      savePending();
      applyServerPantry(res.pantry || []);
      if (state.notice && state.notice.pantry) state.notice = null;
    } catch (err) {
      state.notice = { pantry: true, text: `บันทึกของในครัวลงชีตไม่สำเร็จ (${(err && err.message) || err}) ของยังอยู่ในเครื่องนี้`, action: "ลองอีกครั้ง", onAction: () => syncPantry() };
    }
    syncing = false;
    render();
    if (pending.size && !state.notice) scheduleSync();
  }
  const fmt = (n) => String(Math.round(n * 100) / 100);

  // ---------- parsing ----------
  const clean = (v) => (v == null ? "" : String(v).trim());
  const splitList = (v) => clean(v).split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
  const toNum = (v) => { const n = parseFloat(clean(v)); return Number.isFinite(n) ? n : null; };
  const toBool = (v) => v === true || /^(true|yes|1|✓)$/i.test(clean(v));

  function model() {
    const { recipes: R, rows: W, ingredients: I } = state.raw;
    if (!R || !W || !I) return null;

    const recipes = R.filter((r) => clean(r[0])).map((r) => ({
      name: clean(r[0]),
      cat: clean(r[1]) || OTHER,
      tags: splitList(r[2]),
      time: toNum(r[3]),
      serves: toNum(r[4]),
      steps: clean(r[5]),
      link: clean(r[6]),
      note: clean(r[7]),
    }));

    const byRecipe = new Map();
    W.forEach((r, i) => {
      const menu = clean(r[0]); const ing = clean(r[1]);
      if (!menu || !ing) return;
      if (!byRecipe.has(menu)) byRecipe.set(menu, []);
      byRecipe.get(menu).push({
        row: i + 2, // sheet row in "วัตถุดิบในสูตร" (data starts at row 2) — used by the editor
        name: ing,
        qty: clean(r[2]),
        unit: clean(r[3]),
        optional: toBool(r[4]),
        subs: splitList(r[5]),
      });
    });

    const typeOf = new Map();
    for (const r of I) { const n = clean(r[0]); if (n) typeOf.set(n, clean(r[1]) || OTHER); }
    // anything named in a recipe but missing from the master list still gets a chip
    for (const list of byRecipe.values()) {
      for (const it of list) {
        if (!typeOf.has(it.name)) typeOf.set(it.name, OTHER);
        for (const s of it.subs) if (!typeOf.has(s)) typeOf.set(s, OTHER);
      }
    }
    return { recipes, byRecipe, typeOf };
  }

  // A counted ingredient is compared with the recipe only when the units match (2 ฟอง vs 1 ฟอง);
  // other units (260 กรัม of a potato counted in หัว) fall back to "have it or not".
  function evaluate(recipe, byRecipe) {
    const list = byRecipe.get(recipe.name) || [];
    const needOf = (name, unit) => list.reduce((s, r) => s + (r.name === name && r.unit === unit ? toNum(r.qty) || 0 : 0), 0);
    const items = list.map((it) => {
      const c = state.selected.has(it.name) ? state.counts.get(it.name) : null;
      const need = c && c.unit === it.unit ? needOf(it.name, it.unit) : 0;
      const short = need > c?.count ? { haveN: c.count, needN: need, lack: need - c.count } : null;
      if (state.selected.has(it.name) && !short) return { ...it, status: "have" };
      const sub = it.subs.find((s) => state.selected.has(s));
      if (sub) return { ...it, status: "have", usedSub: sub };
      if (short) return { ...it, ...short, status: it.optional ? "have" : "short" };
      return { ...it, status: it.optional ? "skip" : "miss" };
    });
    const missing = items.filter((i) => i.status === "miss" || i.status === "short");
    const swaps = items.filter((i) => i.usedSub);
    let level = "far";
    if (items.length && missing.length === 0) level = "ready";
    else if (items.length && missing.length <= ALMOST_MAX) level = "almost";
    return { recipe, items, missing, swaps, level };
  }

  // ingredient → menus that become "ทำได้เลย" if only that one ingredient is bought
  function unlockMap(results) {
    const map = new Map();
    for (const x of results) {
      if (x.missing.length !== 1) continue;
      const n = x.missing[0].name;
      if (!map.has(n)) map.set(n, []);
      map.get(n).push(x.recipe.name);
    }
    return map;
  }

  // ingredient → [{menu, qty}] still missing for the menus on the shopping list
  function shoppingList(results) {
    const list = new Map();
    for (const x of results) {
      if (!state.plan.has(x.recipe.name)) continue;
      for (const it of x.missing) {
        if (!list.has(it.name)) list.set(it.name, []);
        const qty = it.status === "short" ? `ขาด ${fmt(it.lack)} ${it.unit}` : [it.qty, it.unit].filter(Boolean).join(" ");
        list.get(it.name).push({ menu: x.recipe.name, qty, needN: it.status === "short" ? it.needN : null });
      }
    }
    return list;
  }

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : null);
  function metaHtml(r) {
    const bits = [`<span class="stamp">${esc(r.cat)}</span>`];
    if (r.time != null) bits.push(`<span>${ICON.clock}<span class="num">${r.time}</span> นาที</span>`);
    if (r.serves != null) bits.push(`<span>${ICON.bowl}<span class="num">${r.serves}</span> ที่</span>`);
    return bits.join("");
  }

  // ---------- render ----------
  let lastView = state.view;
  function render() {
    const m = model();
    const results = m ? m.recipes.map((r) => evaluate(r, m.byRecipe)) : [];
    const ready = results.filter((x) => x.level === "ready");
    const almost = results.filter((x) => x.level === "almost");

    const shopCount = m ? [...shoppingList(results).keys()].filter((n) => !state.bought.has(n)).length : 0;
    $("headTitle").textContent = !m ? "วันนี้ทำอะไรกิน"
      : state.view === "pantry" ? "ของในครัว"
      : state.view === "shop" ? "รายการซื้อ"
      : state.menuSearch.trim() ? "ค้นหาเมนู"
      : state.menuTab === "all" ? "สูตรทั้งหมด"
      : !state.selected.size && !state.plan.size ? "วันนี้ทำอะไรกิน"
      : state.menuTab === "almost" ? "ขาดอีกนิด"
      : "เย็นนี้ทำอะไรดี";
    $("pillPantry").textContent = state.selected.size;
    $("pillMenus").textContent = m ? ready.length : 0;
    $("pillShop").textContent = shopCount || "";

    renderNotice();
    renderSync();

    const VIEWS = ["pantry", "menus", "shop"];
    $("navPantry").setAttribute("aria-current", state.view === "pantry" ? "page" : "false");
    $("navMenus").setAttribute("aria-current", state.view === "menus" ? "page" : "false");
    $("navShop").setAttribute("aria-current", state.view === "shop" ? "page" : "false");

    const view = $("view");
    if (lastView !== state.view) {
      view.classList.remove("from-left", "from-right");
      void view.offsetWidth;
      view.classList.add(VIEWS.indexOf(state.view) > VIEWS.indexOf(lastView) ? "from-right" : "from-left");
      lastView = state.view;
    }

    if (!m) { view.innerHTML = loadingHtml(); return; }
    view.innerHTML = state.view === "pantry" ? pantryHtml(m, ready)
      : state.view === "shop" ? shopViewHtml(results)
      : menusHtml(m, ready, almost, results);
    if (state.view === "menus") {
      const mq = $("mq");
      if (mq) mq.addEventListener("input", (e) => {
        state.menuSearch = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const again = $("mq"); again.focus(); again.setSelectionRange(pos, pos);
      });
    }
    renderAdd(m);
    if (state.openRecipe && !state.edit) { // the editor keeps its own form while open
      const hit = results.find((x) => x.recipe.name === state.openRecipe);
      if (!hit) closeSheet(); else if (state.cook) fillCook(); else fillSheet(hit);
    }
    if (state.countFor) fillCount();
  }

  function loadingHtml() {
    if (state.notice && !state.loading) {
      return `<div class="card empty"><h3>ยังโหลดสูตรไม่ได้</h3><p>ดูวิธีแก้ในกล่องข้อความด้านบน แล้วกดปุ่มโหลดใหม่ที่มุมขวาบน</p></div>`;
    }
    return `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }

  // names → [[type, sorted names]] in TYPE_ORDER; unknown types (or names no longer in the sheet) go to อื่นๆ
  const groupOf = (type) => (TYPE_COLOR[type] ? type : OTHER);
  function byType(names, m) {
    const groups = new Map();
    for (const n of names) {
      const t = groupOf(m.typeOf.get(n));
      if (!groups.has(t)) groups.set(t, []);
      groups.get(t).push(n);
    }
    for (const list of groups.values()) list.sort((a, b) => a.localeCompare(b, "th"));
    return TYPE_ORDER.map(([t]) => t).filter((t) => groups.has(t)).map((t) => [t, groups.get(t)]);
  }

  // the kitchen as it is now: only what is ticked, × when it runs out; new things come in through the add sheet
  function pantryHtml(m, ready) {
    const summary = `<button type="button" class="hero summary" data-view="menus">
        <span class="txt"><span class="meta">มีของอยู่</span><span class="title"><span class="num">${state.selected.size}</span> อย่าง</span></span>
        <span class="cta">ทำได้ <span class="num">${ready.length}</span> เมนู${ICON.chev}</span>
      </button>`;
    if (m.typeOf.size === 0) {
      return `${summary}<div class="card empty"><h3>ยังไม่มีวัตถุดิบในชีต</h3><p>เพิ่มวัตถุดิบในแท็บ "วัตถุดิบ" ของ Google Sheet แล้วกดโหลดใหม่</p></div>`;
    }

    const quick = [...m.typeOf.keys()]
      .filter((n) => freqOf(n) > 0 && !state.selected.has(n))
      .sort((a, b) => freqOf(b) - freqOf(a) || a.localeCompare(b, "th"))
      .slice(0, 6);
    const quickHtml = quick.length
      ? `<section class="quick" aria-label="ของที่เพิ่มบ่อย"><p>ของที่เพิ่มบ่อย แตะเพื่อเพิ่ม</p>
          <div class="chips">${quick.map((n) => `<button type="button" class="chip add" data-qadd="${esc(n)}">${ICON.plus}${esc(n)}</button>`).join("")}</div>
        </section>`
      : "";

    const groups = byType([...state.selected], m);
    const listHtml = groups.length
      ? `<div class="row-between">
          <span class="picked">แตะ × เมื่อของหมด · กดค้างเพื่อนับจำนวน</span>
          <button type="button" class="link-btn" id="clear">ล้างทั้งหมด</button>
        </div>
        ${groups.map(([t, names]) => `<section class="card group" style="--c: var(${TYPE_COLOR[t]})">
          <h2><span class="cdot"></span>${esc(t)}<span class="count">${names.length}</span></h2>
          <div class="chips">${names.map((n) => {
            const c = state.counts.get(n);
            const badge = c ? ` <span class="qty-badge num">${fmt(c.count)}${c.unit ? ` ${esc(c.unit)}` : ""}</span>` : "";
            return `<button type="button" class="chip have" data-rm="${esc(n)}" data-hold="${esc(n)}" aria-label="${esc(n)}${c ? ` ${fmt(c.count)} ${esc(c.unit)}` : ""} แตะเพื่อเอาออก กดค้างเพื่อนับจำนวน">${esc(n)}${badge}${ICON.x}</button>`;
          }).join("")}</div>
        </section>`).join("")}`
      : `<div class="card empty"><h3>ยังไม่มีของในครัว</h3><p>กดเพิ่มของ แล้วเลือกของที่มีอยู่ตอนนี้ รวมเครื่องปรุงด้วย</p></div>`;

    return `
      ${summary}
      <button type="button" class="add-btn" id="addOpen">${ICON.plus}เพิ่มของ</button>
      ${quickHtml}
      ${listHtml}`;
  }

  function menusHtml(m, ready, almost, results) {
    if (!m.recipes.length) {
      return `<div class="card empty"><h3>ยังไม่มีสูตรในชีต</h3><p>เพิ่มเมนูในแท็บ "สูตร" และวัตถุดิบของเมนูในแท็บ "วัตถุดิบในสูตร" แล้วกดโหลดใหม่</p></div>`;
    }
    const searchBox = `<label class="search" for="mq">${ICON.search}<input id="mq" type="search" placeholder="ค้นหาเมนู" value="${esc(state.menuSearch)}" autocomplete="off"></label>`;
    const byTime = (a, b) => (a.recipe.time ?? 999) - (b.recipe.time ?? 999);
    const byMissing = (x, y) => x.missing.length - y.missing.length || byTime(x, y);

    const card = (x) => {
      let extra = "";
      if (x.level === "almost") {
        extra = `<span class="need">ขาด ${x.missing.map((i) => `<span class="miss">${esc(i.name)}${i.status === "short" ? ` มี ${fmt(i.haveN)}/${fmt(i.needN)}` : ""}</span>`).join("")}</span>`;
      } else if (x.level === "far") {
        extra = `<span class="need">${x.items.length ? `ขาด ${x.missing.length} อย่าง` : "ยังไม่มีวัตถุดิบในชีต"}</span>`;
      } else if (x.swaps.length) {
        extra = `<span class="swap">ใช้${x.swaps.map((i) => `${esc(i.usedSub)}แทน${esc(i.name)}`).join(", ")}</span>`;
      }
      // ring: must-have ingredients I have / need (optional ones that are skipped don't count)
      const need = x.items.filter((i) => i.status !== "skip").length;
      const have = need - x.missing.length;
      const C = 113.1; // 2π × 18
      const off = need ? (C * (1 - have / need)).toFixed(1) : C;
      const color = x.level === "ready" ? "var(--brand)" : x.level === "almost" ? "var(--accent)" : "var(--ink-faint)";
      const ring = `<span class="ring" aria-hidden="true"><svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="18" stroke="var(--line-soft)" stroke-width="3"/><circle cx="22" cy="22" r="18" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${need ? `${have}/${need}` : "–"}</b></span>`;
      // almost: one tap puts the menu on the shopping list without opening it
      const inPlan = state.plan.has(x.recipe.name);
      const add = x.level === "almost"
        ? `<button type="button" class="add-mini" data-plan="${esc(x.recipe.name)}" aria-pressed="${inPlan}" aria-label="${inPlan ? "เอาออกจากรายการซื้อ" : "ใส่รายการซื้อ"}: ${esc(x.recipe.name)}">${inPlan ? "✓ ในรายการ" : "+ ซื้อ"}</button>`
        : "";
      return `<div class="menu-row ${x.level}"><button type="button" class="menu-card" data-recipe="${esc(x.recipe.name)}">
        ${ring}
        <span class="body"><span class="name">${esc(x.recipe.name)}</span><span class="meta">${metaHtml(x.recipe)}</span>${extra}</span>
        ${add ? "" : `<span class="chev">${ICON.chev}</span>`}
      </button>${add}</div>`;
    };
    const chapter = (label) => `<p class="chapter"><i aria-hidden="true"></i>${label}<i aria-hidden="true"></i></p>`;
    const section = (cls, title, list) => list.length
      ? `<div class="section-head ${cls}"><h2>${title}</h2><span class="count num">${list.length}</span></div><div class="card list">${list.map(card).join("")}</div>`
      : "";

    // searching: every menu by name or tag, including the ones that are still far from ready
    const q = state.menuSearch.trim().toLowerCase();
    if (q) {
      const hit = results.filter((x) => x.recipe.name.toLowerCase().includes(q) || x.recipe.tags.some((t) => t.toLowerCase().includes(q)));
      const body = hit.length
        ? section("ready", "ทำได้เลย", hit.filter((x) => x.level === "ready").sort(byTime)) +
          section("almost", "ขาดอีกนิด", hit.filter((x) => x.level === "almost").sort(byMissing)) +
          section("far", "ยังไม่พร้อมทำ",hit.filter((x) => x.level === "far").sort(byMissing))
        : `<div class="card empty"><h3>ไม่เจอ "${esc(state.menuSearch)}"</h3><p>ลองค้นด้วยชื่อเมนูหรือแท็กอื่น</p></div>`;
      return `${searchBox}${body}`;
    }

    if (!state.selected.size && !state.plan.size && state.menuTab !== "all") {
      return `<div class="card empty big"><span class="art" aria-hidden="true">${ICON.emptyBowl}</span><h3>ยังไม่ได้บอกว่ามีอะไรบ้าง</h3><p>ติ๊กของที่มีในครัวก่อน แล้วหน้านี้จะบอกว่าทำเมนูไหนได้</p><button type="button" data-goto="pantry">ไปติ๊กของที่มี</button></div>
        ${searchBox}
        <p class="foot">มีสูตรในชีตทั้งหมด <span class="num">${m.recipes.length}</span> เมนู · <button type="button" class="link-btn" data-tab="all">ดูสูตรทั้งหมด</button></p>`;
    }

    // three tabs: ทำได้เลย (hero + ready list), ขาดอีกนิด (buy-to-unlock, almost list, shopping list), ทั้งหมด (every recipe, no ticking needed)
    const tab = state.menuTab;
    const byName = (a, b) => a.recipe.name.localeCompare(b.recipe.name, "th");
    const pool = tab === "almost" ? almost : tab === "all" ? results : ready;
    const cats = [ALL, ...new Set(pool.map((x) => x.recipe.cat))];
    if (!cats.includes(state.cat)) state.cat = ALL;
    const inCat = (x) => state.cat === ALL || x.recipe.cat === state.cat;
    const list = pool.filter(inCat).sort(tab === "almost" ? byMissing : tab === "all" ? byName : byTime);

    const filters = cats.length > 2
      ? `<div class="filters" role="group" aria-label="กรองตามหมวด">${cats.map((c) => `<button type="button" class="filter" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}</button>`).join("")}</div>`
      : "";
    const seg = `<div class="seg" role="group" aria-label="สลับรายการเมนู">
        <button type="button" data-tab="ready" aria-pressed="${tab === "ready"}"><span class="n num">${ready.length}</span>ทำได้เลย</button>
        <button type="button" data-tab="almost" aria-pressed="${tab === "almost"}"><span class="n num">${almost.length}</span>ขาดอีกนิด</button>
        <button type="button" data-tab="all" aria-pressed="${tab === "all"}"><span class="n num">${m.recipes.length}</span>ทั้งหมด</button>
      </div>`;

    if (tab === "all") {
      return `${searchBox}${seg}${filters}${chapter("ทุกเมนู")}<div class="card list">${list.map(card).join("")}</div>`;
    }

    if (tab === "ready") {
      const listBlock = list.length
        ? `${chapter("ทำได้เลย")}<div class="card list">${list.map(card).join("")}</div>`
        : ready.length ? "" : `<div class="card empty"><p>ยังไม่มีเมนูที่ของครบ${almost.length ? " ลองดูแท็บขาดอีกนิด" : ""}</p></div>`;
      return `${searchBox}${seg}${heroHtml(m, ready, byTime)}${filters}${listBlock}`;
    }
    const listBlock = list.length
      ? `${chapter("ขาดอีกนิด")}<div class="card list">${list.map(card).join("")}</div>`
      : `<div class="card empty"><p>ยังไม่มีเมนูที่ขาดแค่ 1–${ALMOST_MAX} อย่าง</p></div>`;
    return `${searchBox}${seg}${filters}${unlockHtml(results)}${listBlock}`;
  }

  // the quickest ready menu, plus a ring of ready / all menus
  function heroHtml(m, ready, byTime) {
    const total = m.recipes.length;
    const C = 163.36; // 2π × 26
    const dash = total ? (C * ready.length) / total : 0;
    const ring = `<span class="ring"><span class="rw"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="26" stroke="currentColor" stroke-opacity=".25" stroke-width="4"/>${dash ? `<circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${C}"/>` : ""}</svg><b>${ready.length}</b></span><span>จาก <span class="num">${total}</span> เมนู</span></span>`;
    const top = [...ready].sort(byTime)[0];
    if (!top) {
      return `<div class="hero static"><span class="top"><span class="txt"><span class="title">ยังไม่มีเมนูที่ของครบ</span><span class="meta">ลองดูแท็บขาดอีกนิด หรือติ๊กของเพิ่ม</span></span>${ring}</span></div>`;
    }
    const r = top.recipe;
    const bits = [
      r.time != null ? `${r.time} นาที` : "",
      r.serves != null ? `${r.serves} ที่` : "",
      top.swaps.length ? "ใช้ของแทนบางอย่าง" : "วัตถุดิบครบ",
    ].filter(Boolean).join(" · ");
    return `<button type="button" class="hero" data-recipe="${esc(r.name)}">
        <span class="top"><span class="txt"><span class="kicker">${ICON.clock}แนะนำมื้อนี้${r.time != null ? " · เร็วสุด" : ""}</span><span class="title">${esc(r.name)}</span><span class="meta">${bits}</span></span>${ring}</span>
        <span class="cta">ดูวิธีทำ${ICON.chev}</span>
      </button>`;
  }

  // ซื้อ page: menus the user put on the shopping list → what is still missing, most menus first;
  // tapping an item = bought, it moves into the kitchen (state.selected) and drops off the list
  function shopViewHtml(results) {
    const list = shoppingList(results);
    if (!state.plan.size) {
      return `<div class="card empty big"><span class="art" aria-hidden="true">${ICON.emptyBowl}</span><h3>ยังไม่มีอะไรต้องซื้อ</h3><p>กด + ซื้อ ที่เมนูในแท็บขาดอีกนิด แล้วของที่ขาดจะมาอยู่ที่นี่</p><button type="button" data-goto="menus" data-tabgo="almost">ไปดูเมนูที่ขาดอีกนิด</button></div>`;
    }
    const rows = [...list]
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "th"))
      .map(([name, uses]) => `<button type="button" class="tool-row shop${state.bought.has(name) ? " done" : ""}" data-bought="${esc(name)}" aria-pressed="${state.bought.has(name)}">
        <span class="box" aria-hidden="true">${ICON.check}</span>
        <span class="t"><b>${esc(name)}</b><small>${uses.map((u) => esc(u.menu + (u.qty ? " " + u.qty : ""))).join(" · ")}</small></span>
        <span class="gain num">${uses.length} เมนู</span>
      </button>`).join("");
    const menus = [...state.plan].sort((a, b) => a.localeCompare(b, "th"));
    const got = [...list.keys()].filter((n) => state.bought.has(n)).length;
    const left = list.size - got;
    return `<section class="card tool">
      <div class="tool-head"><h2>ต้องซื้อ${left ? ` <span class="cnt almost">${left}</span>` : ""}</h2><button type="button" class="link-btn" data-planclear="1">ล้างรายการ</button></div>
      <p class="tool-sub">${!rows ? "ของครบทุกเมนูในรายการแล้ว ไปทำได้เลย" : got ? `ซื้อแล้ว <span class="num">${got}</span> จาก <span class="num">${list.size}</span> อย่าง` : "ซื้อแล้วแตะเพื่อขีดฆ่า ซื้อเสร็จกดปุ่มด้านล่าง"}</p>
      ${rows}
      ${rows ? `<button type="button" class="pill-btn wide shop-done" data-shopdone="1"${got ? "" : " disabled"}>ซื้อเสร็จแล้ว${got ? ` · ย้าย <span class="num">${got}</span> อย่างเข้าครัว` : ""}</button>` : ""}
    </section>
    <p class="chapter"><i aria-hidden="true"></i>สำหรับเมนู<i aria-hidden="true"></i></p>
    <div class="card list">${menus.map((n) => `<div class="menu-row"><button type="button" class="menu-card" data-recipe="${esc(n)}"><span class="body"><span class="name">${esc(n)}</span></span><span class="chev">${ICON.chev}</span></button><button type="button" class="add-mini" data-plan="${esc(n)}" aria-pressed="true" aria-label="เอาออกจากรายการซื้อ: ${esc(n)}">เอาออก</button></div>`).join("")}</div>`;
  }

  // one missing ingredient → the menus it completes; most menus first
  function unlockHtml(results) {
    const rows = [...unlockMap(results)]
      .sort((x, y) => y[1].length - x[1].length || x[0].localeCompare(y[0], "th"))
      .slice(0, 5);
    if (!rows.length) return "";
    return `<section class="card tool unlock">
      <div class="tool-head"><h2>ซื้อเพิ่มอย่างเดียว ทำได้เลย</h2></div>
      <p class="tool-sub">ขาดอยู่ชิ้นเดียว ซื้อมาแล้วเมนูจะครบ</p>
      ${rows.map(([name, ms]) => {
        const added = ms.every((n) => state.plan.has(n));
        return `<div class="tool-row"><div class="t"><b>${esc(name)}</b><small>ได้อีก <span class="num">${ms.length}</span> เมนู: ${ms.map(esc).join(", ")}</small></div>
          <button type="button" class="pill-btn${added ? " ghost" : ""}" data-unlock="${esc(name)}" ${added ? "disabled" : ""}>${added ? `${ICON.check}เพิ่มแล้ว` : `${ICON.plus}รายการซื้อ`}</button></div>`;
      }).join("")}
    </section>`;
  }

  function renderNotice() {
    const el = $("notice");
    if (!state.notice) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    el.className = "notice";
    el.innerHTML = `<span class="dot"></span><div><p>${esc(state.notice.text)}</p>${state.notice.action ? `<button type="button" id="noticeAction">${esc(state.notice.action)}</button>` : ""}</div>`;
  }

  function renderSync() {
    const btn = $("sync");
    btn.classList.toggle("spin", state.loading);
    let label = "กำลังโหลด";
    if (!state.loading) {
      label = state.updatedAt
        ? `อัปเดตล่าสุด ${new Date(state.updatedAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} น.`
        : "ยังโหลดข้อมูลไม่ได้";
    }
    $("syncLabel").textContent = label;
  }

  // ---------- detail sheet ----------
  let lastFocus = null;
  // steps written one per line in the sheet (numbered or not) → a numbered list; a single paragraph stays as text
  function stepsHtml(text) {
    const lines = text.split(/\n+/).map((s) => s.replace(/^\s*(\d+\s*[.)]|[-•])\s*/, "").trim()).filter(Boolean);
    if (lines.length < 2) return `<p class="steps">${esc(text)}</p>`;
    return `<ol class="step-list">${lines.map((s, i) => `<li><span class="no">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}</ol>`;
  }
  function fillSheet(x) {
    const r = x.recipe;
    const rowHtml = (i) => {
      const icon = i.status === "have" ? ICON.check : i.status === "miss" || i.status === "short" ? ICON.miss : ICON.skip;
      let sub = "";
      if (i.usedSub) sub = `ใช้${esc(i.usedSub)}แทน`;
      else if (i.status === "short") sub = `มี ${fmt(i.haveN)} · ขาดอีก ${fmt(i.lack)} ${esc(i.unit)}`;
      else if (i.lack) sub = `มี ${fmt(i.haveN)} ${esc(i.unit)} ไม่พอ แต่ไม่ใส่ก็ได้`;
      else if (i.status === "miss" && i.subs.length) sub = `หรือใช้ ${i.subs.map(esc).join(", ")} แทนได้`;
      else if (i.status === "miss") sub = "ยังไม่มี";
      else if (i.status === "skip") sub = "ไม่ใส่ก็ได้";
      else if (i.optional) sub = "ไม่ใส่ก็ได้";
      const q = [i.qty, i.unit].filter(Boolean).join(" ");
      const cls = i.usedSub ? "have swap" : i.status === "short" ? "miss" : i.status;
      const st = i.usedSub ? ICON.swap : icon;
      // the box toggles "มีในครัว" for the ingredient itself (tap again to undo a mis-tap)
      const own = state.selected.has(i.name);
      return `<li class="${cls}"><button type="button" class="st" data-own="${esc(i.name)}" aria-pressed="${own}" aria-label="${esc(i.name)}: ${own ? "มีในครัวแล้ว แตะเพื่อเอาออก" : "แตะเมื่อมีในครัวแล้ว"}">${st}</button><span class="n">${esc(i.name)}${sub ? `<span class="sub">${sub}</span>` : ""}</span><span class="ld" aria-hidden="true"></span><span class="q">${esc(q)}</span></li>`;
    };
    const url = safeUrl(r.link);
    const m = model();
    const idx = m ? m.recipes.findIndex((y) => y.name === r.name) + 1 : 0;
    const steps = r.steps ? r.steps.split(/\n+/).filter((s) => s.trim()).length : 0;
    $("sheetBody").innerHTML = `
      <div class="dhead">
        <div class="dtop">${idx ? `<span class="folio">สูตรที่ <span class="num">${idx}</span> จาก <span class="num">${m.recipes.length}</span></span>` : "<span></span>"}<button type="button" class="dedit" data-edit="1">แก้ไขสูตร</button></div>
        <h2 id="sheetTitle">${esc(r.name)}</h2>
        <span class="status ${x.level}">${x.level === "ready" ? "ของครบ ทำได้เลย" : x.items.length ? `ขาดอีก ${x.missing.length} อย่าง` : "ยังไม่มีวัตถุดิบในชีต"}</span>
        <div class="facts">
          ${r.time != null ? `<div class="fact"><small>เวลา</small><b><span class="num">${r.time}</span> นาที</b></div>` : ""}
          ${r.serves != null ? `<div class="fact"><small>จำนวน</small><b><span class="num">${r.serves}</span> ที่</b></div>` : ""}
          <div class="fact"><small>หมวด</small><b>${esc(r.cat)}</b></div>
        </div>
      </div>
      ${x.items.length ? `<section><h3>วัตถุดิบ<small>${x.level === "ready" ? "มีครบ" : `ขาด ${x.missing.length} อย่าง`}</small></h3><ul class="ing-list">${x.items.map(rowHtml).join("")}</ul></section>` : ""}
      ${cookNames(x).length ? `<button type="button" class="pill-btn wide cook-btn" data-cook="1">${ICON.check}ทำเมนูนี้แล้ว</button>` : ""}
      ${x.level !== "ready" && x.missing.length ? `<button type="button" class="pill-btn wide ${state.plan.has(r.name) ? "ghost" : ""}" data-plan="${esc(r.name)}">${state.plan.has(r.name) ? "เอาออกจากรายการซื้อของ" : "ใส่รายการซื้อของ"}</button>` : ""}
      ${r.steps ? `<section><h3>วิธีทำ${steps > 1 ? `<small>${steps} ขั้น</small>` : ""}</h3>${stepsHtml(r.steps)}</section>` : ""}
      ${r.tags.length ? `<section><h3>แท็ก</h3><div class="tags">${r.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></section>` : ""}
      ${url ? `<section><h3>สูตรต้นทาง</h3><a class="src" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${ICON.link}${esc(url)}</a></section>` : ""}
      ${r.note ? `<section><h3>หมายเหตุ</h3><p class="note">${esc(r.note)}</p></section>` : ""}`;
  }

  function openSheet(name) {
    const m = model(); if (!m) return;
    const r = m.recipes.find((x) => x.name === name); if (!r) return;
    state.openRecipe = name;
    lastFocus = document.activeElement;
    fillSheet(evaluate(r, m.byRecipe));
    const sheet = $("sheet"), scrim = $("scrim");
    sheet.hidden = false; scrim.hidden = false;
    sheet.querySelector(".scroll").scrollTop = 0;
    requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); });
    sheet.setAttribute("tabindex", "-1");
    sheet.focus({ preventScroll: true });
  }

  function closeSheet() {
    if (!state.openRecipe) return;
    if (state.edit) {
      if (state.edit.saving) return;
      if (editChanges().length && !confirm("ทิ้งสิ่งที่แก้ไว้ในสูตรนี้?")) return;
      state.edit = null;
    }
    state.openRecipe = null;
    state.cook = null;
    const sheet = $("sheet"), scrim = $("scrim");
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!state.openRecipe) { sheet.hidden = true; if (!state.adding) scrim.hidden = true; } }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  // ---------- count sheet (press and hold a chip in ในครัว) ----------
  // units the recipes use with a number for this ingredient, most used first
  function unitsOf(name, m) {
    const f = new Map();
    for (const list of m.byRecipe.values()) {
      for (const r of list) if (r.name === name && r.unit && toNum(r.qty) != null) f.set(r.unit, (f.get(r.unit) || 0) + 1);
    }
    return [...f].sort((a, b) => b[1] - a[1]).map(([u]) => u);
  }
  function openCount(name) {
    const m = model(); if (!m || !state.selected.has(name)) return;
    const c = state.counts.get(name);
    const units = unitsOf(name, m);
    if (c && c.unit && !units.includes(c.unit)) units.unshift(c.unit);
    state.countFor = { name, on: !!c, n: c ? c.count : 1, unit: c ? c.unit : units[0] || "", units };
    lastFocus = document.activeElement;
    fillCount();
    const sheet = $("countSheet"), scrim = $("scrim");
    sheet.hidden = false; scrim.hidden = false;
    requestAnimationFrame(() => { if (state.countFor) { sheet.classList.add("open"); scrim.classList.add("open"); } });
    sheet.setAttribute("tabindex", "-1");
    sheet.focus({ preventScroll: true });
  }
  function fillCount() {
    const f = state.countFor;
    const stepper = f.on
      ? `<div class="stepper"><button type="button" data-cstep="-1" aria-label="ลด 1">−</button><label class="sv"><input id="cN" type="number" inputmode="decimal" min="0" step="any" value="${fmt(f.n)}" aria-label="จำนวน${esc(f.name)}"><span>${esc(f.unit)}</span></label><button type="button" data-cstep="1" aria-label="เพิ่ม 1">+</button></div>
        ${f.units.length > 1 ? `<div class="chips units" role="group" aria-label="หน่วย">${f.units.map((u) => `<button type="button" class="filter" data-cunit="${esc(u)}" aria-pressed="${u === f.unit}">${esc(u)}</button>`).join("")}</div>` : ""}`
      : "";
    $("countBody").innerHTML = `
      <div class="row-between"><h2 id="countTitle">${esc(f.name)}</h2><button type="button" class="link-btn" data-ccancel="1">ปิด</button></div>
      ${f.units.length
        ? `<label class="crow"><span>นับจำนวน<small>เทียบกับสูตรที่ใช้หน่วย ${esc(f.unit)} ไม่พอจะขึ้นว่าขาด</small></span><input type="checkbox" id="cOn"${f.on ? " checked" : ""}></label>${stepper}`
        : `<p class="note">สูตรในชีตไม่ได้ใช้${esc(f.name)}เป็นจำนวน เลยยังนับไม่ได้ แค่มีหรือไม่มีพอ</p>`}
      <button type="button" class="pill-btn wide" data-cdone="1">${f.units.length ? "บันทึก" : "ตกลง"}</button>`;
  }
  function closeCount(save) {
    const f = state.countFor; if (!f) return;
    if (save && f.units.length) {
      if (!f.on) setHave(f.name, true, null);
      else if (f.n > 0) setHave(f.name, true, f.n, f.unit);
      else { const before = snapshot(); setHave(f.name, false); showUndo(`${f.name} หมดแล้ว เอาออกจากครัว`, () => restore(before)); }
    }
    state.countFor = null;
    const sheet = $("countSheet"), scrim = $("scrim");
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!state.countFor) { sheet.hidden = true; if (!state.openRecipe && !state.adding) scrim.hidden = true; } }, 300);
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    render();
  }

  // ---------- ทำแล้ว: after cooking, take what ran out out of the kitchen ----------
  // what this recipe took from the kitchen: the ingredient itself, or the substitute that was used
  function cookNames(x) {
    const names = [];
    for (const i of x.items) {
      const n = i.usedSub || (state.selected.has(i.name) ? i.name : null);
      if (n && !names.includes(n)) names.push(n);
    }
    return names;
  }
  function startCook() {
    const m = model(); if (!m) return;
    const r = m.recipes.find((y) => y.name === state.openRecipe); if (!r) return;
    const list = m.byRecipe.get(r.name) || [];
    state.cook = { name: r.name, rows: cookNames(evaluate(r, m.byRecipe)).map((n) => {
      const type = groupOf(m.typeOf.get(n));
      const c = state.counts.get(n);
      if (!c) return { name: n, type, counted: false, out: USED_UP_TYPES.has(type) };
      const used = list.reduce((s, it) => s + (it.name === n && it.unit === c.unit ? toNum(it.qty) || 0 : 0), 0);
      return { name: n, type, counted: true, from: c.count, used, to: Math.max(0, c.count - used), unit: c.unit };
    }) };
    fillCook();
    $("sheet").querySelector(".scroll").scrollTop = 0;
  }
  function fillCook() {
    const k = state.cook;
    const row = ([r, i]) => r.counted
      ? `<li class="cook-row"><span class="n">${esc(r.name)}<small>เดิม ${fmt(r.from)} ${esc(r.unit)}${r.used ? ` · สูตรใช้ ${fmt(r.used)}` : ""}</small></span>
          <span class="stepper sm"><button type="button" data-kstep="${i}" data-d="-1" aria-label="ลด${esc(r.name)}">−</button><b class="num">${fmt(r.to)} ${esc(r.unit)}</b><button type="button" data-kstep="${i}" data-d="1" aria-label="เพิ่ม${esc(r.name)}">+</button></span></li>`
      : `<li class="cook-row"><span class="n">${esc(r.name)}</span>
          <span class="seg2" role="group" aria-label="${esc(r.name)}"><button type="button" data-kout="${i}" data-v="1" aria-pressed="${r.out}">หมดแล้ว</button><button type="button" data-kout="${i}" data-v="0" aria-pressed="${!r.out}">ยังเหลือ</button></span></li>`;
    const idx = k.rows.map((r, i) => [r, i]);
    const groups = [
      ["นับไว้ ลดให้แล้ว", idx.filter(([r]) => r.counted)],
      ["น่าจะใช้หมด", idx.filter(([r]) => !r.counted && USED_UP_TYPES.has(r.type))],
      ["น่าจะยังเหลือ", idx.filter(([r]) => !r.counted && !USED_UP_TYPES.has(r.type))],
    ].filter(([, l]) => l.length);
    const outN = k.rows.filter((r) => (r.counted ? r.to <= 0 : r.out)).length;
    $("sheetBody").innerHTML = `
      <div class="ehdr"><span class="folio">ทำ${esc(k.name)}แล้ว</span><h2 id="sheetTitle">อะไรหมดไปบ้าง?</h2><p>ตั้งไว้ให้ตามประเภทของ แตะเปลี่ยนได้</p></div>
      ${groups.map(([t, l]) => `<section><h3>${t}</h3><ul class="cook-list">${l.map(row).join("")}</ul></section>`).join("")}
      <div class="cook-foot"><button type="button" class="pill-btn ghost" data-kcancel="1">ยกเลิก</button><button type="button" class="pill-btn" data-kdone="1">${outN ? `เอาออกจากครัว <span class="num">${outN}</span> อย่าง` : "บันทึก"}</button></div>`;
  }
  function finishCook() {
    const k = state.cook; if (!k) return;
    const before = snapshot();
    let out = 0;
    for (const r of k.rows) {
      if (r.counted ? r.to <= 0 : r.out) { setHave(r.name, false); out++; }
      else if (r.counted && r.to !== r.from) setHave(r.name, true, r.to, r.unit);
    }
    closeSheet();
    render();
    showUndo(out ? `อัปเดตครัวแล้ว เอาออก ${out} อย่าง` : "อัปเดตจำนวนในครัวแล้ว", () => restore(before));
  }

  // ---------- recipe editor (Code.js saveRecipe_) ----------
  // The draft keeps each sheet row's original display values (`before`) so the server can refuse to save
  // if the sheet changed meanwhile. Fields edited here: สูตร A,B,D,E,F,H and วัตถุดิบในสูตร B–F.
  const optCol = (c) => [...new Set((state.raw.options || []).map((r) => clean(r[c])).filter(Boolean))];
  function startEdit(name) {
    const m = model(); if (!m) return;
    const before = (state.raw.recipes || []).find((r) => clean(r[0]) === name);
    if (!before) return;
    const items = (m.byRecipe.get(name) || []).map((it) => {
      const raw = state.raw.rows[it.row - 2];
      return { row: it.row, before: raw, name: it.name, qty: clean(raw[2]), unit: clean(raw[3]), optional: toBool(raw[4]), subs: splitList(raw[5]).join(", "), del: false };
    });
    state.edit = {
      orig: name, before,
      f: { name: clean(before[0]), cat: clean(before[1]), time: clean(before[3]), serves: clean(before[4]), steps: clean(before[5]), note: clean(before[7]) },
      items, adds: [], open: null, step: "form", saving: false, error: "",
    };
    renderEdit();
    $("sheet").querySelector(".scroll").scrollTop = 0;
  }
  const REC_FIELDS = [["name", 0, "ชื่อเมนู"], ["cat", 1, "หมวด"], ["time", 3, "เวลา (นาที)"], ["serves", 4, "จำนวนที่ได้ (ที่)"], ["steps", 5, "ขั้นตอน"], ["note", 7, "หมายเหตุ"]];
  const amountOf = (qty, unit) => [qty, unit].filter(Boolean).join(" ");
  const normList = (s) => splitList(s).join(", ");
  // what will change, as [{what, from, to, kind}] — shown on the confirm step (the server logs its own copy)
  function editChanges() {
    const e = state.edit; if (!e) return [];
    const out = [];
    for (const [k, c, label] of REC_FIELDS) {
      const a = clean(e.before[c]), b = e.f[k].trim();
      if (a !== b) out.push({ what: label, from: a, to: b, kind: k === "steps" || k === "note" ? "long" : "" });
    }
    for (const it of e.items) {
      if (it.del) { out.push({ what: `ลบ ${it.name}`, from: amountOf(clean(it.before[2]), clean(it.before[3])) || "(มี)", to: "", kind: "del" }); continue; }
      const pairs = [["ปริมาณ", clean(it.before[2]), it.qty.trim()], ["หน่วย", clean(it.before[3]), it.unit],
        ["ไม่ใส่ก็ได้", toBool(it.before[4]) ? "ใช่" : "ไม่", it.optional ? "ใช่" : "ไม่"], ["ของแทน", normList(it.before[5]), normList(it.subs)]];
      for (const [label, a, b] of pairs) if (a !== b) out.push({ what: `${it.name}: ${label}`, from: a, to: b, kind: "" });
    }

  }
  // checks the server would also make, so mistakes show up before the confirm step
  function editProblems() {
    const e = state.edit;
    const known = new Set((state.raw.ingredients || []).map((r) => clean(r[0])).filter(Boolean));
    const names = (state.raw.recipes || []).map((r) => clean(r[0]));
    const n = e.f.name.trim();
    if (!n) return "ชื่อเมนูว่างไม่ได้";
    if (n !== e.orig && names.includes(n)) return `มีเมนูชื่อ "${n}" อยู่แล้ว`;
    for (const k of ["time", "serves"]) if (e.f[k].trim() && !/^\d+(\.\d+)?$/.test(e.f[k].trim())) return "เวลาและจำนวนที่ได้ต้องเป็นตัวเลข";
    for (const it of [...e.items.filter((x) => !x.del), ...e.adds]) {
      const bad = splitList(it.subs).find((s) => !known.has(s));
      if (bad) return `ของแทน "${bad}" ของ${it.name} ไม่มีในแท็บวัตถุดิบ`;
    }
    return "";
  }
  function selectHtml(attrs, value, list, blank) {
    const opts = list.includes(value) || !value ? list : [value, ...list];
    return `<select ${attrs}>${blank != null ? `<option value=""${value ? "" : " selected"}>${esc(blank)}</option>` : ""}${opts.map((o) => `<option${o === value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  }
  const itemChanged = (it) => it.qty.trim() !== clean(it.before[2]) || it.unit !== clean(it.before[3])
    || it.optional !== toBool(it.before[4]) || normList(it.subs) !== normList(it.before[5]);
  // one ingredient row in edit mode: same look as the recipe, tap to open its small panel, × to remove
  function editRowHtml(it, key, i, units) {
    const k = `${key}${i}`, open = state.edit.open === k;
    if (it.del) {
      return `<li class="gone"><span class="n">${esc(it.name)}<span class="sub">จะลบออก</span></span><span class="ld" aria-hidden="true"></span><button type="button" class="link-btn" data-edel="${i}">เอาคืน</button></li>`;
    }
    const sub = key === "a" ? "เพิ่มใหม่" : itemChanged(it) ? "แก้แล้ว"
      : [it.optional ? "ไม่ใส่ก็ได้" : "", splitList(it.subs).length ? `แทนด้วย ${normList(it.subs)}` : ""].filter(Boolean).join(" · ");
    const mark = key === "a" || itemChanged(it) ? " changed" : "";
    const row = `<li class="erow${mark}${open ? " open" : ""}">
      <button type="button" class="ebtn" data-eopen="${k}" aria-expanded="${open}"><span class="n">${esc(it.name)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span><span class="ld" aria-hidden="true"></span><span class="q">${esc(amountOf(it.qty.trim(), it.unit)) || "—"}</span></button>
      <button type="button" class="ex" ${key === "a" ? `data-aundo="${i}"` : `data-edel="${i}"`} aria-label="ลบ ${esc(it.name)} ออกจากสูตร">${ICON.x}</button>
    </li>`;
    if (!open) return row;
    return row + `<li class="epanel">
      <div class="epair">
        <input data-${key}="${i}" data-k="qty" value="${esc(it.qty)}" placeholder="ปริมาณ" aria-label="ปริมาณ ${esc(it.name)}" inputmode="decimal" data-enter="1">
        ${selectHtml(`data-${key}="${i}" data-k="unit" aria-label="หน่วย ${esc(it.name)}"`, it.unit, units, "ไม่มีหน่วย")}
      </div>
      <label class="echeck"><input type="checkbox" data-${key}="${i}" data-k="optional"${it.optional ? " checked" : ""}> ไม่ใส่ก็ได้</label>
      <label class="esub"><span>ของแทน</span><input data-${key}="${i}" data-k="subs" value="${esc(it.subs)}" placeholder="ไม่มี" aria-label="ของแทน ${esc(it.name)}" list="ingAll" data-enter="1"></label>
      <button type="button" class="link-btn" data-eopen="">เสร็จ</button>
    </li>`;
  }
  function barHtml() {
    const n = editChanges().length;
    return n ? `<span class="ecount">เปลี่ยน <span class="num">${n}</span> อย่าง</span><button type="button" class="pill-btn" data-ereview="1">บันทึก</button>` : "";
  }
  function updateBar() {
    const bar = $("ebar"); if (!bar) return;
    bar.innerHTML = barHtml(); bar.hidden = !bar.innerHTML;
    const c = $("ecancel"); if (c) c.textContent = editChanges().length ? "ยกเลิก" : "เสร็จ";
  }
  function renderEdit() {
    const e = state.edit; if (!e) return;
    const body = $("sheetBody");
    if (e.step === "confirm") {
      const ch = editChanges();
      const val = (v) => (v ? esc(v) : '<i>ว่าง</i>');
      body.innerHTML = `
        <div class="ehdr"><h2 id="sheetTitle">ตรวจก่อนบันทึก</h2><p>${esc(e.orig)} · เปลี่ยน <span class="num">${ch.length}</span> อย่าง จะเขียนลงชีตและเก็บประวัติไว้ในแท็บ "บันทึกการแก้ไข"</p></div>
        <ul class="diff">${ch.map((c) => `<li class="${c.kind}"><b>${esc(c.what)}</b>${c.kind === "del" ? `<span class="from">${val(c.from)}</span>` : c.kind === "add" ? `<span class="to">${val(c.to)}</span>` : `<span class="from">${val(c.from)}</span><span class="arr" aria-label="เปลี่ยนเป็น">→</span><span class="to">${val(c.to)}</span>`}</li>`).join("")}</ul>
        ${e.error ? `<p class="eerr" role="alert">${esc(e.error)}${e.conflict ? ` <button type="button" class="link-btn" data-ereload="1">โหลดข้อมูลใหม่</button>` : ""}</p>` : ""}
        <div class="ebar two"><button type="button" class="pill-btn ghost" data-eback="1"${e.saving ? " disabled" : ""}>กลับไปแก้</button><button type="button" class="pill-btn" data-esave="1"${e.saving ? " disabled" : ""}>${e.saving ? "กำลังบันทึก…" : "ยืนยันบันทึก"}</button></div>`;
      return;
    }
    const o = e.open;
    const units = optCol(2), cats = optCol(0);
    const ingAll = (state.raw.ingredients || []).map((r) => clean(r[0])).filter(Boolean);
    const used = new Set([...e.items.map((x) => x.name), ...e.adds.map((x) => x.name)]);
    const fact = (k, label, unit) => o === k
      ? `<div class="fact on"><small>${label}</small>${k === "cat"
        ? selectHtml(`data-f="cat" data-close="1" aria-label="${label}"`, e.f.cat, cats, "ไม่ระบุ")
        : `<input data-f="${k}" value="${esc(e.f[k])}" inputmode="numeric" aria-label="${label}" data-enter="1" data-focus="1">`}</div>`
      : `<button type="button" class="fact ed" data-eopen="${k}"><small>${label}</small><b>${e.f[k] ? (unit ? `<span class="num">${esc(e.f[k])}</span> ${unit}` : esc(e.f[k])) : "—"}</b></button>`;
    const textBlock = (k, title, rows, emptyText, showHtml) => `<section><h3>${title}<button type="button" class="link-btn sm" data-eopen="${o === k ? "" : k}">${o === k ? "เสร็จ" : e.f[k] ? "แก้" : "เพิ่ม"}</button></h3>
      ${o === k ? `<textarea data-f="${k}" rows="${rows}" aria-label="${title}" data-focus="1">${esc(e.f[k])}</textarea>${k === "steps" ? '<p class="ehint">บรรทัดละขั้น</p>' : ""}`
        : e.f[k] ? showHtml(e.f[k]) : `<p class="note">${emptyText}</p>`}</section>`;
    body.innerHTML = `
      <datalist id="ingAll">${ingAll.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
      <div class="dhead editing">
        <div class="dtop"><span class="folio">กำลังแก้ไข · แตะตรงที่จะแก้</span><button type="button" class="dedit" id="ecancel" data-ecancel="1">${editChanges().length ? "ยกเลิก" : "เสร็จ"}</button></div>
        ${o === "name" ? `<input class="ename" data-f="name" value="${esc(e.f.name)}" aria-label="ชื่อเมนู" data-enter="1" data-focus="1" autocomplete="off">`
          : `<button type="button" class="ename-btn" data-eopen="name"><h2 id="sheetTitle">${esc(e.f.name || "—")}</h2></button>`}
        <div class="facts">${fact("time", "เวลา", "นาที")}${fact("serves", "จำนวน", "ที่")}${fact("cat", "หมวด", "")}</div>
      </div>
      <section><h3>วัตถุดิบ<small>แตะเพื่อแก้ · × เพื่อลบ</small></h3>

          <li class="eaddrow">${o === "add"
            ? `<div class="eadd"><input id="eaddName" list="ingNew" placeholder="พิมพ์ชื่อวัตถุดิบ" aria-label="ชื่อวัตถุดิบที่จะเพิ่ม" autocomplete="off" data-focus="1"><datalist id="ingNew">${ingAll.filter((n) => !used.has(n)).map((n) => `<option value="${esc(n)}">`).join("")}</datalist><button type="button" class="pill-btn" data-eadd="1">เพิ่ม</button></div>`
            : `<button type="button" class="eadd-btn" data-eopen="add">${ICON.plus}เพิ่มวัตถุดิบ</button>`}</li>
        </ul>

      ${e.error ? `<p class="eerr" role="alert">${esc(e.error)}</p>` : ""}

  }
  // keep the draft in sync as you type, without re-rendering (which would drop focus)
  function onEditInput(ev) {
    const e = state.edit, t = ev.target; if (!e || !t.dataset) return;
    const v = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.f) e.f[t.dataset.f] = v;
    else if (t.dataset.i && t.dataset.k) e.items[+t.dataset.i][t.dataset.k] = v;
    else if (t.dataset.a && t.dataset.k) e.adds[+t.dataset.a][t.dataset.k] = v;
    else return;
    e.error = "";
    if (t.dataset.close && ev.type === "change") { e.open = null; return rerenderEdit(); }
    updateBar();
  }
  $("sheetBody").addEventListener("input", onEditInput);
  $("sheetBody").addEventListener("change", onEditInput);
  // structural changes (delete / add a row) re-render the form; keep the scroll position
  function rerenderEdit() {
    const sc = $("sheet").querySelector(".scroll"), top = sc.scrollTop;
    renderEdit(); sc.scrollTop = top;
    const f = $("sheetBody").querySelector("[data-focus]");
    if (f) { f.focus({ preventScroll: true }); if (f.setSelectionRange && f.type !== "number") f.setSelectionRange(f.value.length, f.value.length); }
  }
  function editOpen(k) {

  }
  function editAdd() {
    const e = state.edit, input = $("eaddName");

    if (!n) return input && input.focus();
    const known = (state.raw.ingredients || []).some((r) => clean(r[0]) === n);
    const back = e.items.find((x) => x.name === n && x.del);
    if (back) back.del = false;
    else if (e.items.some((x) => x.name === n) || e.adds.some((x) => x.name === n)) e.error = `${n} อยู่ในสูตรแล้ว`;
    else if (!known) e.error = `ไม่มี "${n}" ในแท็บวัตถุดิบ เพิ่มในชีตก่อนแล้วกดโหลดใหม่`;

    if (!e.error) e.open = back ? null : `a${e.adds.length - 1}`; // new row opens so you can fill the amount
    rerenderEdit();
    const again = $("eaddName"); if (again && e.error) { again.value = n; again.focus(); }
  }
  async function editSave() {

    const after = [...e.before];
    for (const [k, c] of REC_FIELDS) after[c] = clean(e.before[c]) === e.f[k].trim() ? e.before[c] : e.f[k].trim();
    const rowAfter = (it, before) => {
      const opt = before && toBool(before[4]) === it.optional ? before[4] : it.optional ? "TRUE" : "FALSE";
      const keep = (c, v) => (before && clean(before[c]) === v ? before[c] : v);
      return [name, it.name, keep(2, it.qty.trim()), keep(3, it.unit), opt, before && normList(before[5]) === normList(it.subs) ? before[5] : normList(it.subs)];
    };
    const arg = {
      name: e.orig,

    try {
      const d = await api("saveRecipe", arg);

      state.edit = null;
      state.openRecipe = name;
      render();
      showToast("บันทึกลงชีตแล้ว");
      $("sheet").querySelector(".scroll").scrollTop = 0;
    } catch (err) {
      const msg = String((err && err.message) || err);
      e.saving = false;
      e.conflict = msg.startsWith("CONFLICT");
      e.error = `บันทึกไม่สำเร็จ: ${msg.replace(/^(CONFLICT|INVALID):\s*/, "")}`;
      renderEdit();
    }
  }

  // ---------- add sheet ----------
  function addHtml(m) {
    const q = state.addSearch.trim().toLowerCase();
    const has = (n) => state.selected.has(n) || state.pending.has(n);
    const secs = byType([...m.typeOf.keys()], m).map(([t, names]) => {
      const list = q ? names.filter((n) => n.toLowerCase().includes(q)) : names;
      if (!list.length) return "";
      // while searching every type with a match is open, so all hits show at once
      const open = q ? true : state.addOpen === t;
      const fresh = names.filter((n) => state.pending.has(n));
      const canAll = !q && names.some((n) => !has(n));
      const rows = open ? list.map((n) => {
        const owned = state.selected.has(n);
        return `<button type="button" class="arow" data-apick="${esc(n)}" aria-pressed="${has(n)}" ${owned ? "disabled" : ""}>
          <span class="n">${esc(n)}</span>${owned ? `<span class="note">มีแล้ว</span>` : ""}<span class="box" aria-hidden="true">${ICON.check}</span>
        </button>`;
      }).join("") : "";
      return `<section class="asec" style="--c: var(${TYPE_COLOR[t]})">
        <button type="button" class="asec-head" data-aopen="${esc(t)}" aria-expanded="${open}">
          <span class="cdot"></span>
          <span class="t"><b>${esc(t)}</b>${fresh.length ? `<small>เพิ่ม ${fresh.map(esc).join(", ")}</small>` : ""}</span>
          <span class="count num">${names.filter(has).length}/${names.length}</span>
          ${ICON.chev.replace("<svg", '<svg class="chev" aria-hidden="true"')}
        </button>
        ${open && canAll ? `<div class="asec-all"><button type="button" class="link-btn" data-aall="${esc(t)}">เลือกทั้งกลุ่ม</button></div>` : ""}
        ${rows}
      </section>`;
    }).join("");
    return secs || `<p class="add-none">ไม่เจอ "${esc(state.addSearch)}" ถ้ายังไม่มีในรายการ ให้เพิ่มในแท็บ "วัตถุดิบ" ของชีตก่อน</p>`;
  }

  function renderAdd(m = model()) {
    if (!state.adding || !m) return;
    $("addBody").innerHTML = addHtml(m);
    const n = state.pending.size;
    $("addDone").textContent = n ? `เสร็จ เพิ่ม ${n} อย่าง` : "เสร็จ";
  }

  function openAdd() {
    if (!model()) return;
    state.adding = true; state.addSearch = ""; state.pending = new Set();
    $("aq").value = "";
    lastFocus = document.activeElement;
    renderAdd();
    const sheet = $("addSheet"), scrim = $("scrim");
    sheet.hidden = false; scrim.hidden = false;
    $("addBody").scrollTop = 0;
    requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); });
    sheet.setAttribute("tabindex", "-1");
    sheet.focus({ preventScroll: true });
  }

  // commit = "เสร็จ"; closing any other way (ปิด, scrim, Esc) drops the ticks
  function closeAdd(commit) {
    if (!state.adding) return;
    if (commit && state.pending.size) {
      for (const n of state.pending) setHave(n, true);
      bumpFreq([...state.pending]);
    }
    state.adding = false; state.pending = new Set();
    const sheet = $("addSheet"), scrim = $("scrim");
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!state.adding) { sheet.hidden = true; if (!state.openRecipe) scrim.hidden = true; } }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    render();
  }

  // ---------- toast with undo (pantry ×, ทำแล้ว, count to 0) ----------
  let undoFn = null, toastTimer = null;
  function showUndo(text, undo) {
    undoFn = undo || null;
    $("toastText").textContent = text;
    $("toastUndo").hidden = !undoFn;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideUndo, 5000);
  }
  function hideUndo() { undoFn = null; clearTimeout(toastTimer); $("toast").hidden = true; }
  const showToast = (text) => showUndo(text); // same toast, no undo button

  // "ซื้อเสร็จแล้ว": ticked items go into the kitchen, the whole list (menus + ticks) is cleared
  function finishShopping() {
    const m = model(); if (!m) return;
    const names = [...shoppingList(m.recipes.map((r) => evaluate(r, m.byRecipe))).keys()];
    const got = names.filter((n) => state.bought.has(n));
    const left = names.filter((n) => !state.bought.has(n));
    if (!got.length) return;
    if (left.length && !confirm(`ยังไม่ได้ติ๊ก ${left.join(", ")}\nจะล้างออกจากรายการด้วย ซื้อเสร็จแล้วใช่ไหม?`)) return;
    // a counted thing that was short: assume enough was bought for every menu on the list (fix it in ในครัว if not)
    const list = shoppingList(m.recipes.map((r) => evaluate(r, m.byRecipe)));
    const recount = [];
    got.forEach((n) => {
      const c = state.counts.get(n);
      const need = (list.get(n) || []).reduce((s, u) => s + (u.needN || 0), 0);
      if (c && need > c.count) { setHave(n, true, need, c.unit); recount.push(`${n} ${fmt(need)} ${c.unit}`); }
      else setHave(n, true);
    });
    bumpFreq(got);
    state.plan.clear(); state.bought.clear();
    savePlan(); saveBought();
    render();
    showToast(`ย้าย ${got.length} อย่างเข้าครัวแล้ว${recount.length ? ` · นับ${recount.join(", ")}` : ""}`);
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, .scrim");
    if (!t) return;
    if (held) { held = false; if (t.dataset.hold) return; } // the click that ends a press-and-hold
    if (t.id === "scrim") return state.countFor ? closeCount(false) : state.adding ? closeAdd(false) : closeSheet();
    if (t.id === "addOpen") return openAdd();
    if (t.id === "addClose") return closeAdd(false);
    if (t.id === "addDone") return closeAdd(true);
    if (t.dataset.aopen) { state.addOpen = state.addOpen === t.dataset.aopen ? null : t.dataset.aopen; return renderAdd(); }
    if (t.dataset.apick) {
      const n = t.dataset.apick;
      state.pending.has(n) ? state.pending.delete(n) : state.pending.add(n);
      return renderAdd();
    }
    if (t.dataset.aall) {
      const m = model(); if (!m) return;
      const hit = byType([...m.typeOf.keys()], m).find(([type]) => type === t.dataset.aall);
      if (hit) hit[1].forEach((n) => { if (!state.selected.has(n)) state.pending.add(n); });
      return renderAdd(m);
    }
    if (t.dataset.rm) {
      const n = t.dataset.rm, before = snapshot();
      setHave(n, false);
      showUndo(`เอา ${n} ออกแล้ว`, () => restore(before));
      return render();
    }
    if (t.id === "toastUndo") {
      const undo = undoFn;
      hideUndo();
      if (undo) undo();
      return render();
    }
    if (t.dataset.qadd) { setHave(t.dataset.qadd, true); bumpFreq([t.dataset.qadd]); return render(); }
    // count sheet
    if (t.dataset.ccancel) return closeCount(false);
    if (t.dataset.cdone) return closeCount(true);
    if (t.dataset.cstep && state.countFor) {
      const f = state.countFor;
      f.n = Math.max(0, Math.round((f.n + Number(t.dataset.cstep)) * 100) / 100);
      return fillCount();
    }
    if (t.dataset.cunit && state.countFor) { state.countFor.unit = t.dataset.cunit; return fillCount(); }
    // ทำแล้ว sheet
    if (t.dataset.cook) return startCook();
    if (t.dataset.kcancel) { state.cook = null; render(); $("sheet").querySelector(".scroll").scrollTop = 0; return; }
    if (t.dataset.kdone) return finishCook();
    if (t.dataset.kout && state.cook) { state.cook.rows[+t.dataset.kout].out = t.dataset.v === "1"; return fillCook(); }
    if (t.dataset.kstep && state.cook) {
      const r = state.cook.rows[+t.dataset.kstep];
      r.to = Math.max(0, Math.round((r.to + Number(t.dataset.d)) * 100) / 100);
      return fillCook();
    }
    if (t.dataset.view || t.dataset.goto) {
      state.view = t.dataset.view || t.dataset.goto;
      if (t.dataset.tabgo) { state.menuTab = t.dataset.tabgo; state.cat = ALL; }
      window.scrollTo({ top: 0 });
      return render();
    }
    if (t.dataset.cat) { state.cat = t.dataset.cat; return render(); }
    if (t.dataset.tab) { state.menuTab = t.dataset.tab; state.cat = ALL; return render(); }
    if (t.dataset.plan) {
      const n = t.dataset.plan;
      state.plan.has(n) ? state.plan.delete(n) : state.plan.add(n);
      savePlan();
      return render();
    }
    if (t.dataset.unlock) {
      const m = model(); if (!m) return;
      const names = unlockMap(m.recipes.map((r) => evaluate(r, m.byRecipe))).get(t.dataset.unlock) || [];
      names.forEach((n) => state.plan.add(n));
      savePlan();
      return render();
    }
    if (t.dataset.bought) { // tick = strike through; tap again to undo
      const n = t.dataset.bought;
      state.bought.has(n) ? state.bought.delete(n) : state.bought.add(n);
      saveBought(); render();
      const again = [...document.querySelectorAll("[data-bought]")].find((b) => b.dataset.bought === n);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    if (t.dataset.shopdone) return finishShopping();
    if (t.dataset.planclear) { state.plan.clear(); state.bought.clear(); savePlan(); saveBought(); return render(); }
    if (t.dataset.own) {
      const n = t.dataset.own;
      if (state.selected.has(n)) setHave(n, false); else { setHave(n, true); bumpFreq([n]); }
      render();
      const again = [...document.querySelectorAll("#sheetBody [data-own]")].find((b) => b.dataset.own === n);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    if (t.dataset.edit) return startEdit(state.openRecipe);
    if (state.edit) {
      const e = state.edit;
      if (t.dataset.edel) { const it = e.items[+t.dataset.edel]; it.del = !it.del; e.open = null; return rerenderEdit(); }
      if (t.dataset.aundo) { e.adds.splice(+t.dataset.aundo, 1); e.open = null; return rerenderEdit(); }
      if (t.dataset.eadd) return editAdd();
      if ("eopen" in t.dataset) return editOpen(t.dataset.eopen);
      if (t.dataset.ecancel) {
        if (editChanges().length && !confirm("ทิ้งสิ่งที่แก้ไว้ในสูตรนี้?")) return;
        state.edit = null; render(); $("sheet").querySelector(".scroll").scrollTop = 0; return;
      }
      if (t.dataset.ereview) {
        e.error = editProblems() || (editChanges().length ? "" : "ยังไม่ได้แก้อะไร");
        if (!e.error) e.step = "confirm";
        renderEdit();
        if (e.step === "confirm") $("sheet").querySelector(".scroll").scrollTop = 0;
        else { const p = $("sheetBody").querySelector(".eerr"); if (p) p.scrollIntoView({ block: "center" }); }
        return;
      }
      if (t.dataset.eback) { e.step = "form"; e.error = ""; e.open = null; return renderEdit(); }
      if (t.dataset.esave) return editSave();
      if (t.dataset.ereload) { state.edit = null; render(); return load(); }
    }
    if (t.dataset.recipe) return openSheet(t.dataset.recipe);
    if (t.id === "clear") {
      const before = snapshot();
      [...state.selected].forEach((n) => setHave(n, false));
      showUndo("ล้างของในครัวแล้ว", () => restore(before));
      return render();
    }
    if (t.id === "sync") return refresh();
    if (t.id === "noticeAction" && state.notice && state.notice.onAction) return state.notice.onAction();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (state.countFor) closeCount(false); else if (state.adding) closeAdd(false); else closeSheet(); } });

  // press and hold a kitchen chip (or right-click) = open the count sheet instead of removing it
  let held = false, holdTimer = null, holdAt = null;
  document.addEventListener("pointerdown", (e) => {
    const c = e.target.closest("[data-hold]");
    if (!c) return;
    holdAt = [e.clientX, e.clientY];
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { held = true; holdTimer = null; openCount(c.dataset.hold); }, 500);
  });
  const cancelHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  document.addEventListener("pointerup", cancelHold);
  document.addEventListener("pointercancel", cancelHold);
  document.addEventListener("pointermove", (e) => {
    if (holdTimer && holdAt && Math.hypot(e.clientX - holdAt[0], e.clientY - holdAt[1]) > 10) cancelHold();
  });
  document.addEventListener("contextmenu", (e) => {
    const c = e.target.closest("[data-hold]");
    if (!c) return;
    e.preventDefault();
    if (!state.countFor) { cancelHold(); openCount(c.dataset.hold); }
  });
  $("countBody").addEventListener("change", (e) => {
    if (e.target.id === "cOn" && state.countFor) { state.countFor.on = e.target.checked; fillCount(); }
  });
  $("countBody").addEventListener("input", (e) => {
    if (e.target.id === "cN" && state.countFor) { const v = parseFloat(e.target.value); state.countFor.n = Number.isFinite(v) && v >= 0 ? v : 0; }
  });
  $("aq").addEventListener("input", (e) => { state.addSearch = e.target.value; renderAdd(); });
  $("sheetBody").addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" || !state.edit) return;
    if (ev.target.id === "eaddName") { ev.preventDefault(); editAdd(); }
    else if (ev.target.dataset.enter) { ev.preventDefault(); state.edit.open = null; rerenderEdit(); }
  });

  // ---------- Google sign-in ----------
  // ID token lives ~1 h; kept in localStorage so reopening the app within the hour skips the login screen.
  let waiting = null; // { promise, resolve } while the login screen is up
  function storedToken() {
    try {
      const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
      return t && t.exp - 60 > Date.now() / 1000 ? t.token : null;
    } catch { return null; }
  }
  function tokenExp(tok) {
    try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp || 0; } catch { return 0; }
  }
  function forgetToken() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }
  function onCredential(res) {
    const tok = res && res.credential;
    if (!tok) return;
    try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: tok, exp: tokenExp(tok) })); } catch {}
    $("login").hidden = true;
    if (waiting) { const w = waiting; waiting = null; w.resolve(tok); }
  }
  let gsiReady = false;
  function startGsi() {
    if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(startGsi, 200); return; }
    if (!gsiReady) {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, login_hint: OWNER_EMAIL });
      gsiReady = true;
    }
    google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", shape: "pill", text: "signin_with" });
    google.accounts.id.prompt();
  }
  function getToken() {
    const tok = storedToken();
    if (tok) return Promise.resolve(tok);
    if (!waiting) {
      const w = {}; w.promise = new Promise((r) => { w.resolve = r; }); waiting = w;
      $("login").hidden = false; startGsi();
    }
    return waiting.promise;
  }

  // Calls a server function (Code.js doPost). Rejects with an Error whose message is shown in the banner.
  async function api(fn, arg, retried) {
    if (!API_URL) throw new Error("ยังไม่ได้ตั้ง API_URL ใน Index.html");
    const tok = await getToken();
    let res;
    try {
      // text/plain body = "simple" request, so the browser sends no CORS preflight (Apps Script can't answer one)
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, arg, token: tok }) });
      res = await r.json().catch(() => { throw new Error("API ตอบกลับผิดรูปแบบ (เช็ค URL และสิทธิ์ Anyone ของ deployment)"); });
    } catch (e) {
      throw e instanceof Error && e.message.startsWith("API") ? e : new Error(`ต่อเน็ตไม่ได้ (${(e && e.message) || e})`);
    }
    if (res.ok) return res.result;
    const msg = String(res.error || "").replace(/^Error:\s*/, "");
    if (msg.startsWith("AUTH") && !retried) { forgetToken(); return api(fn, arg, true); }
    throw new Error(msg.startsWith("AUTH") ? "บัญชีนี้ไม่มีสิทธิ์ดูข้อมูล" : msg);
  }

  // ---------- data (Code.js getData_) ----------
  function setRaw(d) {
    state.raw = { recipes: d.recipes, rows: d.rows, ingredients: d.ingredients, options: d.options || [] };
    state.updatedAt = d.updatedAt;
    if (!Array.isArray(d.pantry)) return; // older Code.js: the kitchen stays in this browser only
    state.serverPantry = true;
    // one-time move: the sheet has no kitchen yet but this browser does → send it up
    let synced = false;
    try { synced = !!localStorage.getItem(SYNCED_KEY); } catch {}
    if (!synced && !d.pantry.length && state.selected.size) {
      for (const n of state.selected) {
        if (pending.has(n)) continue;
        const c = state.counts.get(n);
        pending.set(n, { name: n, have: true, count: c ? c.count : null, unit: c ? c.unit : "" });
      }
      savePending();
    }
    try { localStorage.setItem(SYNCED_KEY, "1"); } catch {}
    applyServerPantry(d.pantry);
    if (pending.size) scheduleSync(0);
  }
  async function load() {
    state.loading = true; render();
    try {
      const d = await api("getData");
      setRaw(d);
      state.loading = false; state.notice = null;
    } catch (err) {
      // keep whatever was loaded before; only the banner changes
      state.loading = false;
      state.notice = { text: `โหลดข้อมูลจากชีตไม่สำเร็จ: ${(err && err.message) || err}`, action: "ลองอีกครั้ง", onAction: load };
    }
    render();
  }
  const refresh = load;

  // ---------- auto-update ----------
  // The home-screen app on iPhone keeps an old copy of this page. On open / coming back, fetch the live page
  // (bypassing the cache) and, if its version differs, reload under a new ?v= URL so the cache can't answer.
  // "dev" is replaced with the commit hash when the page is copied to recipe-app (see CLAUDE.md).
  const APP_VERSION = "1c13898";
  async function checkUpdate() {
    if (APP_VERSION === "dev" || state.edit || state.adding) return;
    try {
      const r = await fetch(`${location.pathname}?check=${Date.now()}`, { cache: "no-store" });
      const m = (await r.text()).match(/APP_VERSION\s*=\s*"(\w+)"/);
      if (!m || m[1] === APP_VERSION) return;
      const tried = `recipe-finder:tried-${m[1]}`; // once per version, so a stale CDN copy can't cause a reload loop
      if (sessionStorage.getItem(tried)) return;
      sessionStorage.setItem(tried, "1");
      location.replace(`${location.pathname}?v=${m[1]}`);
    } catch {}
  }

  // coming back to the tab after editing the sheet should show the new rows
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); if (pending.size) syncPantry(); return; }
    checkUpdate();
    if (pending.size) scheduleSync(0);
    if (hiddenAt && Date.now() - hiddenAt > 60000 && !state.loading) load();
  });

  render();
  load();
  checkUpdate();
})();
</script>
</body>
