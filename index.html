<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วันนี้ทำอะไรกิน</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทำอะไรกิน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Trirong:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: one mobile column, three views (ในครัว / เมนู / ซื้อ) switched by a dark floating nav capsule.
   Design F (canvas): cookbook feel — Trirong serif headings with italic numbers, Google Sans body,
   cream paper background, white cards with hairlines (no shadows), pill buttons.
   Colours "Basil & Paprika": basil green = ทำได้เลย, paprika = ขาด/ซื้อ, turmeric = ใช้ของแทน */
:root {
  --bg: #fbf8f2;
  --surface: #ffffff;
  --ink: #1f2a24;
  --ink-muted: #5b6b60;
  --ink-faint: #8a968d;
  --brand: #2f6b4f;
  --on-brand: #ffffff;
  --primary: #4f9a72;
  --primary-dark: #24533d;
  --primary-light: #dceee2;
  --accent: #c2410c;
  --accent-ink: #9a3412;
  --accent-light: #fde8da;
  --sub-bg: #fbefc8;
  --sub-ink: #7a5200;
  --danger: #b42318;
  --line: #cfc3ae;
  --line-soft: #ece4d6;
  --chip: #f1ebe0;
  --track: #f1ebe0;
  --nav-bg: #1f2a24;
  --nav-ink: #d5ded8;
  --scrim: rgba(31, 42, 36, 0.36);
  --shadow-card: inset 0 0 0 1px var(--line-soft);
  --shadow-nav: 0 12px 28px -10px rgba(31, 42, 36, 0.45);

  --c-meat: #c1544a;
  --c-sea: #3f8fa0;
  --c-dairy: #4a7fb5;
  --c-tofu: #8f7a35;
  --c-veg: #3f7a5c;
  --c-herb: #5e8c3a;
  --c-fruit: #c97db0;
  --c-grain: #a0784a;
  --c-season: #b58a3f;
  --c-other: #6b7a70;

  --font-body: "Google Sans", "Thonburi", "Leelawadee UI", sans-serif;
  --font-num: "Google Sans", sans-serif;
  --font-head: "Trirong", "Thonburi", serif;
  --radius-card: 22px;
  --radius-tag: 10px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1b231e;
    --ink: #e4ebe5; --ink-muted: #a5b3a9; --ink-faint: #74827a;
    --primary: #7cc29c; --primary-dark: #9fd6b7; --primary-light: #20372a;
    --accent: #f08a5d; --accent-ink: #f4a57e; --accent-light: #3a2218; --danger: #f08a80;
    --sub-bg: #3a3015; --sub-ink: #f0d27a;
    --brand: #7cc29c; --on-brand: #10261a; --chip: #232d27; --track: #232d27;
    --line: #46544a; --line-soft: #2c3730;
    --nav-bg: #e4ebe5; --nav-ink: #3b4840;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow-nav: 0 10px 28px -8px rgba(0, 0, 0, 0.6);
    --c-meat: #e07b71; --c-sea: #6cbccd; --c-dairy: #7fa9db; --c-tofu: #c9b067; --c-veg: #6fb38f;
    --c-herb: #93c06b; --c-fruit: #dd9cc8; --c-grain: #cba076; --c-season: #d6ad62; --c-other: #98a89e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1b231e;
  --ink: #e4ebe5; --ink-muted: #a5b3a9; --ink-faint: #74827a;
  --primary: #7cc29c; --primary-dark: #9fd6b7; --primary-light: #20372a;
  --accent: #f08a5d; --accent-ink: #f4a57e; --accent-light: #3a2218; --danger: #f08a80;
  --sub-bg: #3a3015; --sub-ink: #f0d27a;
  --brand: #7cc29c; --on-brand: #10261a; --chip: #232d27; --track: #232d27;
  --line: #46544a; --line-soft: #2c3730;
  --nav-bg: #e4ebe5; --nav-ink: #3b4840;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow-nav: 0 10px 28px -8px rgba(0, 0, 0, 0.6);
  --c-meat: #e07b71; --c-sea: #6cbccd; --c-dairy: #7fa9db; --c-tofu: #c9b067; --c-veg: #6fb38f;
  --c-herb: #93c06b; --c-fruit: #dd9cc8; --c-grain: #cba076; --c-season: #d6ad62; --c-other: #98a89e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-family: var(--font-head); font-size: 28px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.head h1 .num { font-family: var(--font-head); font-style: italic; }
.head .sub { margin: 0 0 2px; font-size: 13px; font-weight: 500; color: var(--ink-muted); }
.sync {
  width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink); cursor: pointer;
  transition: transform 140ms var(--ease-out);
}
.sync:active { transform: scale(0.94); }
.sync svg { width: 18px; height: 18px; }
.sync.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Notice banner */
.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: var(--radius-card);
  background: var(--accent-light); color: var(--ink); font-size: 14px;
}
.notice .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
.notice p { margin: 0; }
.notice button {
  margin-top: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px;
  border: 0; background: var(--accent-ink); color: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer;
}

/* Card surface: borderless white, soft shadow */
.card {
  position: relative;
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

/* Hero: the one green card — the quickest menu that is ready now, with a ring of ready / all menus. Flat, no decoration. */
.hero {
  position: relative; display: block; width: 100%;
  padding: 20px; border: 0; border-radius: var(--radius-card); color: var(--on-brand); text-align: left; cursor: pointer;
  background: var(--brand);
  transition: transform 140ms var(--ease-out);
}
.hero:active { transform: scale(0.985); }
.hero.static { cursor: default; }
.hero.static:active { transform: none; }
.hero .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero .txt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.hero .kicker {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px;
  border-radius: 999px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-brand) 55%, transparent); font-size: 12px; font-weight: 600;
}
.hero .kicker svg { width: 14px; height: 14px; }
.hero .title { margin-top: 12px; font-family: var(--font-head); font-size: 28px; line-height: 1.35; font-weight: 600; text-wrap: balance; }
.hero .meta { margin-top: 2px; font-size: 13px; }
.hero .ring { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; white-space: nowrap; }
.hero .ring .rw { position: relative; width: 64px; height: 64px; }
.hero .ring svg { display: block; width: 64px; height: 64px; transform: rotate(-90deg); }
.hero .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-head); font-style: italic; font-size: 24px; font-weight: 600; }
.hero .cta {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px 0 20px;
  border-radius: 999px; background: var(--bg); color: var(--ink); font-size: 15px; font-weight: 600;
}
.hero .cta svg { width: 16px; height: 16px; }
/* Pantry version: one row — how many picked, and a button over to the menus */
.hero.summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 20px; }
.hero.summary .title, .hero.summary .meta { margin-top: 0; }
.hero.summary .title { font-size: 24px; }
.hero.summary .title .num { font-family: var(--font-head); font-style: italic; }
.hero.summary .cta { margin-top: 0; flex-shrink: 0; }

/* Tabs with counts: ทำได้เลย / ขาดอีกนิด / ทั้งหมด — underline, big italic serif numbers */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.seg button {
  position: relative; min-width: 0; min-height: 60px; padding: 0 2px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; white-space: nowrap;
  border: 0; background: transparent; color: var(--ink-muted); font-size: 13px; font-weight: 500; cursor: pointer;
}
.seg button .n { font-family: var(--font-head); font-style: italic; font-size: 26px; font-weight: 600; line-height: 1; color: var(--ink-muted); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.seg button[aria-pressed="true"] .n { color: var(--brand); }
.seg button[aria-pressed="true"][data-tab="almost"] .n { color: var(--accent-ink); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 14px; bottom: -1px; height: 2px; background: var(--ink); }
.cnt {
  min-width: 24px; height: 22px; padding: 0 7px; box-sizing: border-box; display: inline-grid; place-items: center;
  border-radius: 999px; font-family: var(--font-num); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.cnt.ready { background: var(--primary-light); color: var(--primary-dark); }
.cnt.almost { background: var(--accent-light); color: var(--accent-ink); }
.cnt:not(.ready):not(.almost) { background: var(--line-soft); color: var(--ink-muted); }

/* View container */
.view { display: flex; flex-direction: column; gap: 16px; }
.view.from-right { animation: inR 240ms var(--ease-out); }
.view.from-left { animation: inL 240ms var(--ease-out); }
@keyframes inR { from { opacity: 0; transform: translateX(22px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-22px); } }

/* Search */
.search {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 46px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line-soft);
}
.search svg { width: 18px; height: 18px; color: var(--ink-faint); flex-shrink: 0; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font: inherit; color: var(--ink);
}
.search input::placeholder { color: var(--ink-faint); }
.search:focus-within { border-color: var(--brand); }

.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.picked { font-size: 13px; color: var(--ink-muted); }
.link-btn {
  border: 0; background: none; padding: 4px 2px; cursor: pointer;
  font-size: 13px; color: var(--primary-dark); font-weight: 600;
}
.link-btn:disabled { color: var(--ink-faint); cursor: default; }

/* Ingredient groups */
.group { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.group h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.group h2 .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.group h2 .count { margin-left: auto; font-family: var(--font-num); font-size: 12px; color: var(--ink-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 999px;
  border: 0; background: var(--chip);
  font-size: 15px; cursor: pointer;
  transition: transform 140ms var(--ease-out), background-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
}
.chip:active { transform: scale(0.95); }
.chip .tick {
  width: 14px; height: 14px; margin-left: -2px; display: none;
}
.chip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent);
  font-weight: 600;
}
.chip[aria-pressed="true"] .tick { display: block; color: var(--c); }
.chip:focus-visible, .menu-card:focus-visible, .nav button:focus-visible, .filter:focus-visible, .sync:focus-visible, .hero:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* Pantry: only what is in the kitchen now (× when it runs out), new things come from the add sheet */
.chip.have {
  gap: 8px; padding: 8px 12px 8px 16px; font-weight: 600;
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent);
}
.chip.have svg { width: 14px; height: 14px; opacity: 0.55; }
.chip.add { gap: 6px; padding: 8px 16px 8px 12px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
.chip.add svg { width: 14px; height: 14px; }
.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
  box-shadow: 0 10px 22px -10px rgba(11, 61, 66, 0.6);
  transition: transform 140ms var(--ease-out);
}
.add-btn:active { transform: scale(0.98); }
.add-btn svg { width: 18px; height: 18px; }
.quick { display: flex; flex-direction: column; gap: 8px; }
.quick p { margin: 0 4px; font-size: 13px; font-weight: 500; color: var(--ink-muted); }

/* Add sheet: one collapsible card per ingredient type */
.sheet.add { height: 88%; background: var(--bg); }
.add-head { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 20px 12px; }
.add-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.add-head h2 { margin: 0; font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.add-head .link-btn { min-height: 44px; font-size: 14px; }
.sheet.add .scroll { flex: 1; min-height: 0; padding-top: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.asec { flex-shrink: 0; overflow: hidden; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card); }
.asec-head {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px;
  border: 0; background: transparent; text-align: left; cursor: pointer;
}
.asec-head .cdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.asec-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.asec-head b { font-size: 16px; font-weight: 700; }
.asec-head small { font-size: 13px; font-weight: 600; color: var(--brand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asec-head .count { font-size: 13px; color: var(--ink-muted); }
.asec-head .chev { width: 18px; height: 18px; flex-shrink: 0; color: var(--ink-faint); transition: transform 200ms var(--ease-out); }
.asec-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.asec-all { padding: 0 8px; border-top: 1px solid var(--line-soft); }
.asec-all .link-btn { min-height: 44px; padding: 0 8px; font-size: 14px; }
.arow {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px;
  border: 0; border-top: 1px solid var(--line-soft); background: transparent;
  text-align: left; font-size: 16px; cursor: pointer;
}
.arow .n { flex: 1; min-width: 0; }
.arow .note { font-size: 13px; color: var(--ink-muted); }
.arow .box {
  width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center;
  border-radius: 9px; border: 2px solid var(--ink-faint); color: var(--surface);
}
.arow .box svg { width: 15px; height: 15px; display: none; }
.arow[aria-pressed="true"] .box { background: var(--c); border-color: var(--c); }
.arow[aria-pressed="true"] .box svg { display: block; }
.arow:disabled { cursor: default; opacity: 0.7; }
.arow:disabled .box { background: var(--ink-faint); border-color: var(--ink-faint); }
.add-none { margin: 32px 8px; text-align: center; font-size: 14px; color: var(--ink-muted); }
.add-foot {
  flex-shrink: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line-soft);
}
.add-foot button {
  width: 100%; min-height: 52px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
}
.add-btn:focus-visible, .asec-head:focus-visible, .arow:focus-visible, .add-foot button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* Filters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: -2px -2px -6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0;
  background: transparent; box-shadow: inset 0 0 0 1px var(--line);
  font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.filter .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: none; }

/* Menu sections */
.section-head { display: flex; align-items: center; gap: 8px; margin: 6px 4px -6px; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.section-head .count {
  min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
  font-family: var(--font-num); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.section-head.ready .count { background: var(--primary-light); color: var(--primary-dark); }
.section-head.almost .count { background: var(--accent-light); color: var(--accent-ink); }

/* Chapter divider above a list: hairline — ◆ label ◆ — hairline */
.chapter { display: flex; align-items: center; gap: 10px; margin: 2px 0 -6px; font-family: var(--font-head); font-style: italic; font-size: 15px; font-weight: 500; color: var(--ink-muted); }
.chapter::before, .chapter::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chapter i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--brand); flex-shrink: 0; }

/* Menu rows: one grouped card, each row = open button (ring · name · meta) + optional "+ ซื้อ" */
.list { overflow: hidden; }
.menu-row { position: relative; display: flex; align-items: center; padding-right: 12px; }
.menu-row + .menu-row::before {
  content: ""; position: absolute; top: 0; left: 74px; right: 0; height: 1px; background: var(--line-soft);
}
.menu-card {
  position: relative; flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 14px;
  min-height: 76px; padding: 14px 4px 14px 16px; border: 0; background: transparent;
  text-align: left; cursor: pointer;
  transition: background-color 140ms var(--ease-out);
}
.menu-card:active { background: var(--line-soft); }
.menu-card .ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
.menu-card .ring svg { display: block; width: 44px; height: 44px; transform: rotate(-90deg); }
.menu-card .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.menu-row.ready .ring b { color: var(--brand); }
.menu-row.almost .ring b { color: var(--accent-ink); }

    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
    emptyBowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5" stroke-dasharray="1.6 1.6"/></svg>',
  };
  const ALL = "ทั้งหมด";

  const state = {
    raw: { recipes: null, rows: null, ingredients: null },
    updatedAt: null,
    loading: true,
    notice: null, // {code, text, action?}
    view: "pantry",
    menuSearch: "",
    cat: "ทั้งหมด",
    menuTab: "ready", // ready | almost | all
    selected: new Set(loadSelected()),
    plan: new Set(loadPlan()),
    freq: loadFreq(),
    openRecipe: null,
    // add sheet: ticks stay in `pending` until "เสร็จ"
    adding: false,
    addSearch: "",
    addOpen: null,
    pending: new Set(),
  };

  // ---------- storage (per-viewer convenience only) ----------
  function loadSelected() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch { return []; }
  }
  function saveSelected() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...state.selected])); } catch {}
  }
  function loadPlan() {
    try { return JSON.parse(localStorage.getItem(PLAN_KEY) || "[]"); } catch { return []; }
  }
  function savePlan() {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify([...state.plan])); } catch {}
  }
  function loadFreq() {
    try { const f = JSON.parse(localStorage.getItem(FREQ_KEY) || "{}"); return f && typeof f === "object" ? f : {}; } catch { return {}; }
  }
  const freqOf = (n) => (Object.prototype.hasOwnProperty.call(state.freq, n) ? Number(state.freq[n]) || 0 : 0);
  function bumpFreq(names) {
    for (const n of names) state.freq[n] = freqOf(n) + 1;
    try { localStorage.setItem(FREQ_KEY, JSON.stringify(state.freq)); } catch {}
  }

  // ---------- parsing ----------
  const clean = (v) => (v == null ? "" : String(v).trim());
  const splitList = (v) => clean(v).split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
  const toNum = (v) => { const n = parseFloat(clean(v)); return Number.isFinite(n) ? n : null; };
  const toBool = (v) => v === true || /^(true|yes|1|✓)$/i.test(clean(v));

  function model() {
    const { recipes: R, rows: W, ingredients: I } = state.raw;
    if (!R || !W || !I) return null;

    const recipes = R.filter((r) => clean(r[0])).map((r) => ({
      name: clean(r[0]),
      cat: clean(r[1]) || OTHER,
      tags: splitList(r[2]),
      time: toNum(r[3]),
      serves: toNum(r[4]),
      steps: clean(r[5]),
      link: clean(r[6]),
      note: clean(r[7]),
    }));

    const byRecipe = new Map();
    for (const r of W) {
      const menu = clean(r[0]); const ing = clean(r[1]);
      if (!menu || !ing) continue;
      if (!byRecipe.has(menu)) byRecipe.set(menu, []);
      byRecipe.get(menu).push({
        name: ing,
        qty: clean(r[2]),
        unit: clean(r[3]),
        optional: toBool(r[4]),
        subs: splitList(r[5]),
      });
    }

    const typeOf = new Map();
    for (const r of I) { const n = clean(r[0]); if (n) typeOf.set(n, clean(r[1]) || OTHER); }
    // anything named in a recipe but missing from the master list still gets a chip
    for (const list of byRecipe.values()) {
      for (const it of list) {
        if (!typeOf.has(it.name)) typeOf.set(it.name, OTHER);
        for (const s of it.subs) if (!typeOf.has(s)) typeOf.set(s, OTHER);
      }
    }
    return { recipes, byRecipe, typeOf };
  }

  function evaluate(recipe, byRecipe) {
    const items = (byRecipe.get(recipe.name) || []).map((it) => {
      if (state.selected.has(it.name)) return { ...it, status: "have" };
      const sub = it.subs.find((s) => state.selected.has(s));
      if (sub) return { ...it, status: "have", usedSub: sub };
      return { ...it, status: it.optional ? "skip" : "miss" };
    });
    const missing = items.filter((i) => i.status === "miss");
    const swaps = items.filter((i) => i.usedSub);
    let level = "far";
    if (items.length && missing.length === 0) level = "ready";
    else if (items.length && missing.length <= ALMOST_MAX) level = "almost";
    return { recipe, items, missing, swaps, level };
  }

  // ingredient → menus that become "ทำได้เลย" if only that one ingredient is bought
  function unlockMap(results) {
    const map = new Map();
    for (const x of results) {
      if (x.missing.length !== 1) continue;
      const n = x.missing[0].name;
      if (!map.has(n)) map.set(n, []);
      map.get(n).push(x.recipe.name);
    }
    return map;
  }

  // ingredient → [{menu, qty}] still missing for the menus on the shopping list
  function shoppingList(results) {
    const list = new Map();
    for (const x of results) {
      if (!state.plan.has(x.recipe.name)) continue;
      for (const it of x.missing) {
        if (!list.has(it.name)) list.set(it.name, []);
        list.get(it.name).push({ menu: x.recipe.name, qty: [it.qty, it.unit].filter(Boolean).join(" ") });
      }
    }
    return list;
  }

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (id) => document.getElementById(id);
  const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : null);
  function metaHtml(r) {
    const bits = [`<span class="stamp">${esc(r.cat)}</span>`];
    if (r.time != null) bits.push(`<span>${ICON.clock}<span class="num">${r.time}</span> นาที</span>`);
    if (r.serves != null) bits.push(`<span>${ICON.bowl}<span class="num">${r.serves}</span> ที่</span>`);
    return bits.join("");
  }

  // ---------- render ----------
  let lastView = state.view;
  function render() {
    const m = model();
    const results = m ? m.recipes.map((r) => evaluate(r, m.byRecipe)) : [];
    const ready = results.filter((x) => x.level === "ready");
    const almost = results.filter((x) => x.level === "almost");

    const shopCount = m ? shoppingList(results).size : 0;
    $("headTitle").textContent = !m ? "วันนี้ทำอะไรกิน"
      : state.view === "pantry" ? "ของในครัว"
      : state.view === "shop" ? "รายการซื้อ"
      : state.menuSearch.trim() ? "ค้นหาเมนู"
      : state.menuTab === "all" ? "สูตรทั้งหมด"
      : !state.selected.size && !state.plan.size ? "วันนี้ทำอะไรกิน"
      : state.menuTab === "almost" ? "ขาดอีกนิด"
      : "เย็นนี้ทำอะไรดี";
    $("pillPantry").textContent = state.selected.size;
    $("pillMenus").textContent = m ? ready.length : 0;
    $("pillShop").textContent = shopCount || "";

    renderNotice();
    renderSync();

    const VIEWS = ["pantry", "menus", "shop"];
    $("navPantry").setAttribute("aria-current", state.view === "pantry" ? "page" : "false");
    $("navMenus").setAttribute("aria-current", state.view === "menus" ? "page" : "false");
    $("navShop").setAttribute("aria-current", state.view === "shop" ? "page" : "false");

    const view = $("view");
    if (lastView !== state.view) {
      view.classList.remove("from-left", "from-right");
      void view.offsetWidth;
      view.classList.add(VIEWS.indexOf(state.view) > VIEWS.indexOf(lastView) ? "from-right" : "from-left");
      lastView = state.view;
    }

    if (!m) { view.innerHTML = loadingHtml(); return; }
    view.innerHTML = state.view === "pantry" ? pantryHtml(m, ready)
      : state.view === "shop" ? shopViewHtml(results)
      : menusHtml(m, ready, almost, results);
    if (state.view === "menus") {
      const mq = $("mq");
      if (mq) mq.addEventListener("input", (e) => {
        state.menuSearch = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const again = $("mq"); again.focus(); again.setSelectionRange(pos, pos);
      });
    }
    renderAdd(m);
    if (state.openRecipe) {
      const hit = results.find((x) => x.recipe.name === state.openRecipe);
      if (hit) fillSheet(hit); else closeSheet();
    }
  }

  function loadingHtml() {
    if (state.notice && !state.loading) {
      return `<div class="card empty"><h3>ยังโหลดสูตรไม่ได้</h3><p>ดูวิธีแก้ในกล่องข้อความด้านบน แล้วกดปุ่มโหลดใหม่ที่มุมขวาบน</p></div>`;
    }
    return `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }

  // names → [[type, sorted names]] in TYPE_ORDER; unknown types (or names no longer in the sheet) go to อื่นๆ
  const groupOf = (type) => (TYPE_COLOR[type] ? type : OTHER);
  function byType(names, m) {
    const groups = new Map();
    for (const n of names) {
      const t = groupOf(m.typeOf.get(n));
      if (!groups.has(t)) groups.set(t, []);
      groups.get(t).push(n);
    }
    for (const list of groups.values()) list.sort((a, b) => a.localeCompare(b, "th"));
    return TYPE_ORDER.map(([t]) => t).filter((t) => groups.has(t)).map((t) => [t, groups.get(t)]);
  }

  // the kitchen as it is now: only what is ticked, × when it runs out; new things come in through the add sheet
  function pantryHtml(m, ready) {
    const summary = `<button type="button" class="hero summary" data-view="menus">
        <span class="txt"><span class="meta">มีของอยู่</span><span class="title"><span class="num">${state.selected.size}</span> อย่าง</span></span>
        <span class="cta">ทำได้ <span class="num">${ready.length}</span> เมนู${ICON.chev}</span>
      </button>`;
    if (m.typeOf.size === 0) {
      return `${summary}<div class="card empty"><h3>ยังไม่มีวัตถุดิบในชีต</h3><p>เพิ่มวัตถุดิบในแท็บ "วัตถุดิบ" ของ Google Sheet แล้วกดโหลดใหม่</p></div>`;
    }

    const quick = [...m.typeOf.keys()]
      .filter((n) => freqOf(n) > 0 && !state.selected.has(n))
      .sort((a, b) => freqOf(b) - freqOf(a) || a.localeCompare(b, "th"))
      .slice(0, 6);
    const quickHtml = quick.length
      ? `<section class="quick" aria-label="ของที่เพิ่มบ่อย"><p>ของที่เพิ่มบ่อย แตะเพื่อเพิ่ม</p>
          <div class="chips">${quick.map((n) => `<button type="button" class="chip add" data-qadd="${esc(n)}">${ICON.plus}${esc(n)}</button>`).join("")}</div>
        </section>`
      : "";

    const groups = byType([...state.selected], m);
    const listHtml = groups.length
      ? `<div class="row-between">
          <span class="picked">แตะ × เมื่อของหมด</span>
          <button type="button" class="link-btn" id="clear">ล้างทั้งหมด</button>
        </div>
        ${groups.map(([t, names]) => `<section class="card group" style="--c: var(${TYPE_COLOR[t]})">
          <h2><span class="cdot"></span>${esc(t)}<span class="count">${names.length}</span></h2>
          <div class="chips">${names.map((n) => `<button type="button" class="chip have" data-rm="${esc(n)}" aria-label="${esc(n)} แตะเพื่อเอาออก">${esc(n)}${ICON.x}</button>`).join("")}</div>
        </section>`).join("")}`
      : `<div class="card empty"><h3>ยังไม่มีของในครัว</h3><p>กดเพิ่มของ แล้วเลือกของที่มีอยู่ตอนนี้ รวมเครื่องปรุงด้วย</p></div>`;

    return `
      ${summary}
      <button type="button" class="add-btn" id="addOpen">${ICON.plus}เพิ่มของ</button>
      ${quickHtml}
      ${listHtml}`;
  }

  function menusHtml(m, ready, almost, results) {
    if (!m.recipes.length) {
      return `<div class="card empty"><h3>ยังไม่มีสูตรในชีต</h3><p>เพิ่มเมนูในแท็บ "สูตร" และวัตถุดิบของเมนูในแท็บ "วัตถุดิบในสูตร" แล้วกดโหลดใหม่</p></div>`;
    }
    const searchBox = `<label class="search" for="mq">${ICON.search}<input id="mq" type="search" placeholder="ค้นหาเมนู" value="${esc(state.menuSearch)}" autocomplete="off"></label>`;
    const byTime = (a, b) => (a.recipe.time ?? 999) - (b.recipe.time ?? 999);
    const byMissing = (x, y) => x.missing.length - y.missing.length || byTime(x, y);

    const card = (x) => {
      let extra = "";
      if (x.level === "almost") {
        extra = `<span class="need">ขาด ${x.missing.map((i) => `<span class="miss">${esc(i.name)}</span>`).join("")}</span>`;
      } else if (x.level === "far") {
        extra = `<span class="need">${x.items.length ? `ขาด ${x.missing.length} อย่าง` : "ยังไม่มีวัตถุดิบในชีต"}</span>`;
      } else if (x.swaps.length) {
        extra = `<span class="swap">ใช้${x.swaps.map((i) => `${esc(i.usedSub)}แทน${esc(i.name)}`).join(", ")}</span>`;
      }
      // ring: must-have ingredients I have / need (optional ones that are skipped don't count)
      const need = x.items.filter((i) => i.status !== "skip").length;
      const have = need - x.missing.length;
      const C = 113.1; // 2π × 18
      const off = need ? (C * (1 - have / need)).toFixed(1) : C;
      const color = x.level === "ready" ? "var(--brand)" : x.level === "almost" ? "var(--accent)" : "var(--ink-faint)";
      const ring = `<span class="ring" aria-hidden="true"><svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="18" stroke="var(--line-soft)" stroke-width="3"/><circle cx="22" cy="22" r="18" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${need ? `${have}/${need}` : "–"}</b></span>`;
      // almost: one tap puts the menu on the shopping list without opening it
      const inPlan = state.plan.has(x.recipe.name);
      const add = x.level === "almost"
        ? `<button type="button" class="add-mini" data-plan="${esc(x.recipe.name)}" aria-pressed="${inPlan}" aria-label="${inPlan ? "เอาออกจากรายการซื้อ" : "ใส่รายการซื้อ"}: ${esc(x.recipe.name)}">${inPlan ? "✓ ในรายการ" : "+ ซื้อ"}</button>`
        : "";
      return `<div class="menu-row ${x.level}"><button type="button" class="menu-card" data-recipe="${esc(x.recipe.name)}">
        ${ring}
        <span class="body"><span class="name">${esc(x.recipe.name)}</span><span class="meta">${metaHtml(x.recipe)}</span>${extra}</span>
        ${add ? "" : `<span class="chev">${ICON.chev}</span>`}
      </button>${add}</div>`;
    };
    const chapter = (label) => `<p class="chapter"><i aria-hidden="true"></i>${label}<i aria-hidden="true"></i></p>`;
    const section = (cls, title, list) => list.length
      ? `<div class="section-head ${cls}"><h2>${title}</h2><span class="count num">${list.length}</span></div><div class="card list">${list.map(card).join("")}</div>`
      : "";

    // searching: every menu by name or tag, including the ones that are still far from ready
    const q = state.menuSearch.trim().toLowerCase();
    if (q) {
      const hit = results.filter((x) => x.recipe.name.toLowerCase().includes(q) || x.recipe.tags.some((t) => t.toLowerCase().includes(q)));
      const body = hit.length
        ? section("ready", "ทำได้เลย", hit.filter((x) => x.level === "ready").sort(byTime)) +
          section("almost", "ขาดอีกนิด", hit.filter((x) => x.level === "almost").sort(byMissing)) +
          section("far", "ยังไม่พร้อมทำ",hit.filter((x) => x.level === "far").sort(byMissing))
        : `<div class="card empty"><h3>ไม่เจอ "${esc(state.menuSearch)}"</h3><p>ลองค้นด้วยชื่อเมนูหรือแท็กอื่น</p></div>`;
      return `${searchBox}${body}`;
    }

    if (!state.selected.size && !state.plan.size && state.menuTab !== "all") {
      return `<div class="card empty big"><span class="art" aria-hidden="true">${ICON.emptyBowl}</span><h3>ยังไม่ได้บอกว่ามีอะไรบ้าง</h3><p>ติ๊กของที่มีในครัวก่อน แล้วหน้านี้จะบอกว่าทำเมนูไหนได้</p><button type="button" data-goto="pantry">ไปติ๊กของที่มี</button></div>
        ${searchBox}
        <p class="foot">มีสูตรในชีตทั้งหมด <span class="num">${m.recipes.length}</span> เมนู · <button type="button" class="link-btn" data-tab="all">ดูสูตรทั้งหมด</button></p>`;
    }

    // three tabs: ทำได้เลย (hero + ready list), ขาดอีกนิด (buy-to-unlock, almost list, shopping list), ทั้งหมด (every recipe, no ticking needed)
    const tab = state.menuTab;
    const byName = (a, b) => a.recipe.name.localeCompare(b.recipe.name, "th");
    const pool = tab === "almost" ? almost : tab === "all" ? results : ready;
    const cats = [ALL, ...new Set(pool.map((x) => x.recipe.cat))];
    if (!cats.includes(state.cat)) state.cat = ALL;
    const inCat = (x) => state.cat === ALL || x.recipe.cat === state.cat;
    const list = pool.filter(inCat).sort(tab === "almost" ? byMissing : tab === "all" ? byName : byTime);

    const filters = cats.length > 2
      ? `<div class="filters" role="group" aria-label="กรองตามหมวด">${cats.map((c) => `<button type="button" class="filter" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}</button>`).join("")}</div>`
      : "";
    const seg = `<div class="seg" role="group" aria-label="สลับรายการเมนู">
        <button type="button" data-tab="ready" aria-pressed="${tab === "ready"}"><span class="n num">${ready.length}</span>ทำได้เลย</button>
        <button type="button" data-tab="almost" aria-pressed="${tab === "almost"}"><span class="n num">${almost.length}</span>ขาดอีกนิด</button>
        <button type="button" data-tab="all" aria-pressed="${tab === "all"}"><span class="n num">${m.recipes.length}</span>ทั้งหมด</button>
      </div>`;

    if (tab === "all") {
      return `${searchBox}${seg}${filters}${chapter("ทุกเมนู")}<div class="card list">${list.map(card).join("")}</div>`;
    }

    if (tab === "ready") {
      const listBlock = list.length
        ? `${chapter("ทำได้เลย")}<div class="card list">${list.map(card).join("")}</div>`
        : ready.length ? "" : `<div class="card empty"><p>ยังไม่มีเมนูที่ของครบ${almost.length ? " ลองดูแท็บขาดอีกนิด" : ""}</p></div>`;
      return `${searchBox}${seg}${heroHtml(m, ready, byTime)}${filters}${listBlock}`;
    }
    const listBlock = list.length
      ? `${chapter("ขาดอีกนิด")}<div class="card list">${list.map(card).join("")}</div>`
      : `<div class="card empty"><p>ยังไม่มีเมนูที่ขาดแค่ 1–${ALMOST_MAX} อย่าง</p></div>`;
    return `${searchBox}${seg}${filters}${unlockHtml(results)}${listBlock}`;
  }

  // the quickest ready menu, plus a ring of ready / all menus
  function heroHtml(m, ready, byTime) {
    const total = m.recipes.length;
    const C = 163.36; // 2π × 26
    const dash = total ? (C * ready.length) / total : 0;
    const ring = `<span class="ring"><span class="rw"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="26" stroke="currentColor" stroke-opacity=".25" stroke-width="4"/>${dash ? `<circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${C}"/>` : ""}</svg><b>${ready.length}</b></span><span>จาก <span class="num">${total}</span> เมนู</span></span>`;
    const top = [...ready].sort(byTime)[0];
    if (!top) {
      return `<div class="hero static"><span class="top"><span class="txt"><span class="title">ยังไม่มีเมนูที่ของครบ</span><span class="meta">ลองดูแท็บขาดอีกนิด หรือติ๊กของเพิ่ม</span></span>${ring}</span></div>`;
    }
    const r = top.recipe;
    const bits = [
      r.time != null ? `${r.time} นาที` : "",
      r.serves != null ? `${r.serves} ที่` : "",
      top.swaps.length ? "ใช้ของแทนบางอย่าง" : "วัตถุดิบครบ",
    ].filter(Boolean).join(" · ");
    return `<button type="button" class="hero" data-recipe="${esc(r.name)}">
        <span class="top"><span class="txt"><span class="kicker">${ICON.clock}แนะนำมื้อนี้${r.time != null ? " · เร็วสุด" : ""}</span><span class="title">${esc(r.name)}</span><span class="meta">${bits}</span></span>${ring}</span>
        <span class="cta">ดูวิธีทำ${ICON.chev}</span>
      </button>`;
  }

  // ซื้อ page: menus the user put on the shopping list → what is still missing, most menus first;
  // tapping an item = bought, it moves into the kitchen (state.selected) and drops off the list
  function shopViewHtml(results) {
    const list = shoppingList(results);
    if (!state.plan.size) {
      return `<div class="card empty big"><span class="art" aria-hidden="true">${ICON.emptyBowl}</span><h3>ยังไม่มีอะไรต้องซื้อ</h3><p>กด + ซื้อ ที่เมนูในแท็บขาดอีกนิด แล้วของที่ขาดจะมาอยู่ที่นี่</p><button type="button" data-goto="menus" data-tabgo="almost">ไปดูเมนูที่ขาดอีกนิด</button></div>`;
    }
    const rows = [...list]
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "th"))
      .map(([name, uses]) => `<button type="button" class="tool-row shop" data-bought="${esc(name)}">
        <span class="box" aria-hidden="true"></span>
        <span class="t"><b>${esc(name)}</b><small>${uses.map((u) => esc(u.menu + (u.qty ? " " + u.qty : ""))).join(" · ")}</small></span>
        <span class="gain num">${uses.length} เมนู</span>
      </button>`).join("");
    const menus = [...state.plan].sort((a, b) => a.localeCompare(b, "th"));
    return `<section class="card tool">
      <div class="tool-head"><h2>ต้องซื้อ${list.size ? ` <span class="cnt almost">${list.size}</span>` : ""}</h2><button type="button" class="link-btn" data-planclear="1">ล้างรายการ</button></div>
      <p class="tool-sub">${rows ? "ซื้อแล้วแตะที่ชื่อ ของจะย้ายเข้าครัวให้เลย" : "ของครบทุกเมนูในรายการแล้ว ไปทำได้เลย"}</p>
      ${rows}
    </section>
    <p class="chapter"><i aria-hidden="true"></i>สำหรับเมนู<i aria-hidden="true"></i></p>
    <div class="card list">${menus.map((n) => `<div class="menu-row"><button type="button" class="menu-card" data-recipe="${esc(n)}"><span class="body"><span class="name">${esc(n)}</span></span><span class="chev">${ICON.chev}</span></button><button type="button" class="add-mini" data-plan="${esc(n)}" aria-pressed="true" aria-label="เอาออกจากรายการซื้อ: ${esc(n)}">เอาออก</button></div>`).join("")}</div>`;
  }

  // one missing ingredient → the menus it completes; most menus first
  function unlockHtml(results) {
    const rows = [...unlockMap(results)]
      .sort((x, y) => y[1].length - x[1].length || x[0].localeCompare(y[0], "th"))
      .slice(0, 5);
    if (!rows.length) return "";
    return `<section class="card tool unlock">
      <div class="tool-head"><h2>ซื้อเพิ่มอย่างเดียว ทำได้เลย</h2></div>
      <p class="tool-sub">ขาดอยู่ชิ้นเดียว ซื้อมาแล้วเมนูจะครบ</p>
      ${rows.map(([name, ms]) => {
        const added = ms.every((n) => state.plan.has(n));
        return `<div class="tool-row"><div class="t"><b>${esc(name)}</b><small>ได้อีก <span class="num">${ms.length}</span> เมนู: ${ms.map(esc).join(", ")}</small></div>
          <button type="button" class="pill-btn${added ? " ghost" : ""}" data-unlock="${esc(name)}" ${added ? "disabled" : ""}>${added ? `${ICON.check}เพิ่มแล้ว` : `${ICON.plus}รายการซื้อ`}</button></div>`;
      }).join("")}
    </section>`;
  }

  function renderNotice() {
    const el = $("notice");
    if (!state.notice) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    el.className = "notice";
    el.innerHTML = `<span class="dot"></span><div><p>${esc(state.notice.text)}</p>${state.notice.action ? `<button type="button" id="noticeAction">${esc(state.notice.action)}</button>` : ""}</div>`;
  }

  function renderSync() {
    const btn = $("sync");
    btn.classList.toggle("spin", state.loading);
    let label = "กำลังโหลด";
    if (!state.loading) {
      label = state.updatedAt
        ? `อัปเดตล่าสุด ${new Date(state.updatedAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} น.`
        : "ยังโหลดข้อมูลไม่ได้";
    }
    $("syncLabel").textContent = label;
  }

  // ---------- detail sheet ----------
  let lastFocus = null;
  // steps written one per line in the sheet (numbered or not) → a numbered list; a single paragraph stays as text
  function stepsHtml(text) {
    const lines = text.split(/\n+/).map((s) => s.replace(/^\s*(\d+\s*[.)]|[-•])\s*/, "").trim()).filter(Boolean);
    if (lines.length < 2) return `<p class="steps">${esc(text)}</p>`;
    return `<ol class="step-list">${lines.map((s, i) => `<li><span class="no">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}</ol>`;
  }
  function fillSheet(x) {
    const r = x.recipe;
    const rowHtml = (i) => {
      const icon = i.status === "have" ? ICON.check : i.status === "miss" ? ICON.miss : ICON.skip;
      let sub = "";
      if (i.usedSub) sub = `ใช้${esc(i.usedSub)}แทน`;
      else if (i.status === "miss" && i.subs.length) sub = `หรือใช้ ${i.subs.map(esc).join(", ")} แทนได้`;
      else if (i.status === "miss") sub = "ยังไม่มี";
      else if (i.status === "skip") sub = "ไม่ใส่ก็ได้";
      else if (i.optional) sub = "ไม่ใส่ก็ได้";
      const q = [i.qty, i.unit].filter(Boolean).join(" ");
      const cls = i.usedSub ? "have swap" : i.status;
      const st = i.usedSub ? ICON.swap : icon;
      return `<li class="${cls}"><span class="st" aria-hidden="true">${st}</span><span class="n">${esc(i.name)}${sub ? `<span class="sub">${sub}</span>` : ""}</span><span class="ld" aria-hidden="true"></span><span class="q">${esc(q)}</span></li>`;
    };
    const url = safeUrl(r.link);
    const m = model();
    const idx = m ? m.recipes.findIndex((y) => y.name === r.name) + 1 : 0;
    const steps = r.steps ? r.steps.split(/\n+/).filter((s) => s.trim()).length : 0;
    $("sheetBody").innerHTML = `
      <div class="dhead">
        ${idx ? `<span class="folio">สูตรที่ <span class="num">${idx}</span> จาก <span class="num">${m.recipes.length}</span></span>` : ""}
        <h2 id="sheetTitle">${esc(r.name)}</h2>
        <span class="status ${x.level}">${x.level === "ready" ? "ของครบ ทำได้เลย" : x.items.length ? `ขาดอีก ${x.missing.length} อย่าง` : "ยังไม่มีวัตถุดิบในชีต"}</span>
        <div class="facts">
          ${r.time != null ? `<div class="fact"><small>เวลา</small><b><span class="num">${r.time}</span> นาที</b></div>` : ""}
          ${r.serves != null ? `<div class="fact"><small>จำนวน</small><b><span class="num">${r.serves}</span> ที่</b></div>` : ""}
          <div class="fact"><small>หมวด</small><b>${esc(r.cat)}</b></div>
        </div>
      </div>
      ${x.items.length ? `<section><h3>วัตถุดิบ<small>${x.level === "ready" ? "มีครบ" : `ขาด ${x.missing.length} อย่าง`}</small></h3><ul class="ing-list">${x.items.map(rowHtml).join("")}</ul></section>` : ""}
      ${x.level !== "ready" && x.missing.length ? `<button type="button" class="pill-btn wide ${state.plan.has(r.name) ? "ghost" : ""}" data-plan="${esc(r.name)}">${state.plan.has(r.name) ? "เอาออกจากรายการซื้อของ" : "ใส่รายการซื้อของ"}</button>` : ""}
      ${r.steps ? `<section><h3>วิธีทำ${steps > 1 ? `<small>${steps} ขั้น</small>` : ""}</h3>${stepsHtml(r.steps)}</section>` : ""}
      ${r.tags.length ? `<section><h3>แท็ก</h3><div class="tags">${r.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></section>` : ""}
      ${url ? `<section><h3>สูตรต้นทาง</h3><a class="src" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${ICON.link}${esc(url)}</a></section>` : ""}
      ${r.note ? `<section><h3>หมายเหตุ</h3><p class="note">${esc(r.note)}</p></section>` : ""}`;
  }

  function openSheet(name) {
    const m = model(); if (!m) return;
    const r = m.recipes.find((x) => x.name === name); if (!r) return;
    state.openRecipe = name;
    lastFocus = document.activeElement;
    fillSheet(evaluate(r, m.byRecipe));
    const sheet = $("sheet"), scrim = $("scrim");
    sheet.hidden = false; scrim.hidden = false;
    sheet.querySelector(".scroll").scrollTop = 0;
    requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); });
    sheet.setAttribute("tabindex", "-1");
    sheet.focus({ preventScroll: true });
  }

  function closeSheet() {
    if (!state.openRecipe) return;
    state.openRecipe = null;
    const sheet = $("sheet"), scrim = $("scrim");
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!state.openRecipe) { sheet.hidden = true; if (!state.adding) scrim.hidden = true; } }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  // ---------- add sheet ----------
  function addHtml(m) {
    const q = state.addSearch.trim().toLowerCase();
    const has = (n) => state.selected.has(n) || state.pending.has(n);
    const secs = byType([...m.typeOf.keys()], m).map(([t, names]) => {
      const list = q ? names.filter((n) => n.toLowerCase().includes(q)) : names;
      if (!list.length) return "";
      // while searching every type with a match is open, so all hits show at once
      const open = q ? true : state.addOpen === t;
      const fresh = names.filter((n) => state.pending.has(n));
      const canAll = !q && names.some((n) => !has(n));
      const rows = open ? list.map((n) => {
        const owned = state.selected.has(n);
        return `<button type="button" class="arow" data-apick="${esc(n)}" aria-pressed="${has(n)}" ${owned ? "disabled" : ""}>
          <span class="n">${esc(n)}</span>${owned ? `<span class="note">มีแล้ว</span>` : ""}<span class="box" aria-hidden="true">${ICON.check}</span>
        </button>`;
      }).join("") : "";
      return `<section class="asec" style="--c: var(${TYPE_COLOR[t]})">
        <button type="button" class="asec-head" data-aopen="${esc(t)}" aria-expanded="${open}">
          <span class="cdot"></span>
          <span class="t"><b>${esc(t)}</b>${fresh.length ? `<small>เพิ่ม ${fresh.map(esc).join(", ")}</small>` : ""}</span>
          <span class="count num">${names.filter(has).length}/${names.length}</span>
          ${ICON.chev.replace("<svg", '<svg class="chev" aria-hidden="true"')}
        </button>
        ${open && canAll ? `<div class="asec-all"><button type="button" class="link-btn" data-aall="${esc(t)}">เลือกทั้งกลุ่ม</button></div>` : ""}
        ${rows}
      </section>`;
    }).join("");
    return secs || `<p class="add-none">ไม่เจอ "${esc(state.addSearch)}" ถ้ายังไม่มีในรายการ ให้เพิ่มในแท็บ "วัตถุดิบ" ของชีตก่อน</p>`;
  }

  function renderAdd(m = model()) {
    if (!state.adding || !m) return;
    $("addBody").innerHTML = addHtml(m);
    const n = state.pending.size;
    $("addDone").textContent = n ? `เสร็จ เพิ่ม ${n} อย่าง` : "เสร็จ";
  }

  function openAdd() {
    if (!model()) return;
    state.adding = true; state.addSearch = ""; state.pending = new Set();
    $("aq").value = "";
    lastFocus = document.activeElement;
    renderAdd();
    const sheet = $("addSheet"), scrim = $("scrim");
    sheet.hidden = false; scrim.hidden = false;
    $("addBody").scrollTop = 0;
    requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); });
    sheet.setAttribute("tabindex", "-1");
    sheet.focus({ preventScroll: true });
  }

  // commit = "เสร็จ"; closing any other way (ปิด, scrim, Esc) drops the ticks
  function closeAdd(commit) {
    if (!state.adding) return;
    if (commit && state.pending.size) {
      for (const n of state.pending) state.selected.add(n);
      bumpFreq([...state.pending]);
      saveSelected();
    }
    state.adding = false; state.pending = new Set();
    const sheet = $("addSheet"), scrim = $("scrim");
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!state.adding) { sheet.hidden = true; if (!state.openRecipe) scrim.hidden = true; } }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    render();
  }

  // ---------- undo toast (pantry ×) ----------
  let lastRemoved = null, toastTimer = null;
  function showUndo(name) {
    lastRemoved = name;
    $("toastText").textContent = `เอา ${name} ออกแล้ว`;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideUndo, 5000);
  }
  function hideUndo() { lastRemoved = null; clearTimeout(toastTimer); $("toast").hidden = true; }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, .scrim");
    if (!t) return;
    if (t.id === "scrim") return state.adding ? closeAdd(false) : closeSheet();
    if (t.id === "addOpen") return openAdd();
    if (t.id === "addClose") return closeAdd(false);
    if (t.id === "addDone") return closeAdd(true);
    if (t.dataset.aopen) { state.addOpen = state.addOpen === t.dataset.aopen ? null : t.dataset.aopen; return renderAdd(); }
    if (t.dataset.apick) {
      const n = t.dataset.apick;
      state.pending.has(n) ? state.pending.delete(n) : state.pending.add(n);
      return renderAdd();
    }
    if (t.dataset.aall) {
      const m = model(); if (!m) return;
      const hit = byType([...m.typeOf.keys()], m).find(([type]) => type === t.dataset.aall);
      if (hit) hit[1].forEach((n) => { if (!state.selected.has(n)) state.pending.add(n); });
      return renderAdd(m);
    }
    if (t.dataset.rm) { state.selected.delete(t.dataset.rm); saveSelected(); showUndo(t.dataset.rm); return render(); }
    if (t.id === "toastUndo") {
      if (lastRemoved) { state.selected.add(lastRemoved); saveSelected(); }
      hideUndo();
      return render();
    }
    if (t.dataset.qadd) { state.selected.add(t.dataset.qadd); bumpFreq([t.dataset.qadd]); saveSelected(); return render(); }
    if (t.dataset.view || t.dataset.goto) {
      state.view = t.dataset.view || t.dataset.goto;
      if (t.dataset.tabgo) { state.menuTab = t.dataset.tabgo; state.cat = ALL; }
      window.scrollTo({ top: 0 });
      return render();
    }
    if (t.dataset.cat) { state.cat = t.dataset.cat; return render(); }
    if (t.dataset.tab) { state.menuTab = t.dataset.tab; state.cat = ALL; return render(); }
    if (t.dataset.plan) {
      const n = t.dataset.plan;
      state.plan.has(n) ? state.plan.delete(n) : state.plan.add(n);
      savePlan();
      return render();
    }
    if (t.dataset.unlock) {
      const m = model(); if (!m) return;
      const names = unlockMap(m.recipes.map((r) => evaluate(r, m.byRecipe))).get(t.dataset.unlock) || [];
      names.forEach((n) => state.plan.add(n));
      savePlan();
      return render();
    }
    if (t.dataset.bought) { state.selected.add(t.dataset.bought); saveSelected(); return render(); }
    if (t.dataset.planclear) { state.plan.clear(); savePlan(); return render(); }
    if (t.dataset.recipe) return openSheet(t.dataset.recipe);
    if (t.id === "clear") { state.selected.clear(); saveSelected(); return render(); }
    if (t.id === "sync") return refresh();
    if (t.id === "noticeAction" && state.notice && state.notice.onAction) return state.notice.onAction();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (state.adding) closeAdd(false); else closeSheet(); } });
  $("aq").addEventListener("input", (e) => { state.addSearch = e.target.value; renderAdd(); });

  // ---------- Google sign-in ----------
  // ID token lives ~1 h; kept in localStorage so reopening the app within the hour skips the login screen.
  let waiting = null; // { promise, resolve } while the login screen is up
  function storedToken() {
    try {
      const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
      return t && t.exp - 60 > Date.now() / 1000 ? t.token : null;
    } catch { return null; }
  }
  function tokenExp(tok) {
    try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp || 0; } catch { return 0; }
  }
  function forgetToken() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }
  function onCredential(res) {
    const tok = res && res.credential;
    if (!tok) return;
    try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: tok, exp: tokenExp(tok) })); } catch {}
    $("login").hidden = true;
    if (waiting) { const w = waiting; waiting = null; w.resolve(tok); }
  }
  let gsiReady = false;
  function startGsi() {
    if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(startGsi, 200); return; }
    if (!gsiReady) {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, login_hint: OWNER_EMAIL });
      gsiReady = true;
    }
    google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", shape: "pill", text: "signin_with" });
    google.accounts.id.prompt();
  }
  function getToken() {
    const tok = storedToken();
    if (tok) return Promise.resolve(tok);
    if (!waiting) {
      const w = {}; w.promise = new Promise((r) => { w.resolve = r; }); waiting = w;
      $("login").hidden = false; startGsi();
    }
    return waiting.promise;
  }

  // Calls a server function (Code.js doPost). Rejects with an Error whose message is shown in the banner.
  async function api(fn, arg, retried) {
    if (!API_URL) throw new Error("ยังไม่ได้ตั้ง API_URL ใน Index.html");
    const tok = await getToken();
    let res;
    try {
      // text/plain body = "simple" request, so the browser sends no CORS preflight (Apps Script can't answer one)
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, arg, token: tok }) });
      res = await r.json().catch(() => { throw new Error("API ตอบกลับผิดรูปแบบ (เช็ค URL และสิทธิ์ Anyone ของ deployment)"); });
    } catch (e) {
      throw e instanceof Error && e.message.startsWith("API") ? e : new Error(`ต่อเน็ตไม่ได้ (${(e && e.message) || e})`);
    }
    if (res.ok) return res.result;
    const msg = String(res.error || "").replace(/^Error:\s*/, "");
    if (msg.startsWith("AUTH") && !retried) { forgetToken(); return api(fn, arg, true); }
    throw new Error(msg.startsWith("AUTH") ? "บัญชีนี้ไม่มีสิทธิ์ดูข้อมูล" : msg);
  }

  // ---------- data (Code.js getData_) ----------
  async function load() {
    state.loading = true; render();
    try {
      const d = await api("getData");
      state.raw = { recipes: d.recipes, rows: d.rows, ingredients: d.ingredients };
      state.updatedAt = d.updatedAt;
      state.loading = false; state.notice = null;
    } catch (err) {
      // keep whatever was loaded before; only the banner changes
      state.loading = false;
      state.notice = { text: `โหลดข้อมูลจากชีตไม่สำเร็จ: ${(err && err.message) || err}`, action: "ลองอีกครั้ง", onAction: load };
    }
    render();
  }
  const refresh = load;

  // coming back to the tab after editing the sheet should show the new rows
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 60000 && !state.loading) load();
  });

  render();
  load();
})();
</script>
</body>
</html>
