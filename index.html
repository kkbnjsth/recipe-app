<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วันนี้ทำอะไรกิน</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทำอะไรกิน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Trirong:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: one mobile column, three views (ในครัว / เมนู / ซื้อ) switched by a dark floating nav capsule.
   Design F (canvas): cookbook feel — Trirong serif headings with italic numbers, Google Sans body,
   cream paper background, white cards with hairlines (no shadows), pill buttons.
   Colours "Basil & Paprika": basil green = ทำได้เลย, paprika = ขาด/ซื้อ, turmeric = ใช้ของแทน */
:root {
  --bg: #fbf8f2;
  --surface: #ffffff;
  --ink: #1f2a24;
  --ink-muted: #5b6b60;
  --ink-faint: #8a968d;
  --brand: #2f6b4f;
  --on-brand: #ffffff;
  --primary: #4f9a72;
  --primary-dark: #24533d;
  --primary-light: #dceee2;
  --accent: #c2410c;
  --accent-ink: #9a3412;
  --accent-light: #fde8da;
  --sub-bg: #fbefc8;
  --sub-ink: #7a5200;
  --danger: #b42318;
  --line: #cfc3ae;
  --line-soft: #ece4d6;
  --chip: #f1ebe0;
  --track: #f1ebe0;
  --nav-bg: #1f2a24;
  --nav-ink: #d5ded8;
  --scrim: rgba(31, 42, 36, 0.36);
  --shadow-card: inset 0 0 0 1px var(--line-soft);
  --shadow-nav: 0 12px 28px -10px rgba(31, 42, 36, 0.45);

  --c-meat: #c1544a;
  --c-sea: #3f8fa0;
  --c-dairy: #4a7fb5;
  --c-tofu: #8f7a35;
  --c-veg: #3f7a5c;
  --c-herb: #5e8c3a;
  --c-fruit: #c97db0;
  --c-grain: #a0784a;
  --c-season: #b58a3f;
  --c-other: #6b7a70;

  --font-body: "Google Sans", "Thonburi", "Leelawadee UI", sans-serif;
  --font-num: "Google Sans", sans-serif;
  --font-head: "Trirong", "Thonburi", serif;
  --radius-card: 22px;
  --radius-tag: 10px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1b231e;
    --ink: #e4ebe5; --ink-muted: #a5b3a9; --ink-faint: #74827a;
    --primary: #7cc29c; --primary-dark: #9fd6b7; --primary-light: #20372a;
    --accent: #f08a5d; --accent-ink: #f4a57e; --accent-light: #3a2218; --danger: #f08a80;
    --sub-bg: #3a3015; --sub-ink: #f0d27a;
    --brand: #7cc29c; --on-brand: #10261a; --chip: #232d27; --track: #232d27;
    --line: #46544a; --line-soft: #2c3730;
    --nav-bg: #e4ebe5; --nav-ink: #3b4840;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow-nav: 0 10px 28px -8px rgba(0, 0, 0, 0.6);
    --c-meat: #e07b71; --c-sea: #6cbccd; --c-dairy: #7fa9db; --c-tofu: #c9b067; --c-veg: #6fb38f;
    --c-herb: #93c06b; --c-fruit: #dd9cc8; --c-grain: #cba076; --c-season: #d6ad62; --c-other: #98a89e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1b231e;
  --ink: #e4ebe5; --ink-muted: #a5b3a9; --ink-faint: #74827a;
  --primary: #7cc29c; --primary-dark: #9fd6b7; --primary-light: #20372a;
  --accent: #f08a5d; --accent-ink: #f4a57e; --accent-light: #3a2218; --danger: #f08a80;
  --sub-bg: #3a3015; --sub-ink: #f0d27a;
  --brand: #7cc29c; --on-brand: #10261a; --chip: #232d27; --track: #232d27;
  --line: #46544a; --line-soft: #2c3730;
  --nav-bg: #e4ebe5; --nav-ink: #3b4840;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow-nav: 0 10px 28px -8px rgba(0, 0, 0, 0.6);
  --c-meat: #e07b71; --c-sea: #6cbccd; --c-dairy: #7fa9db; --c-tofu: #c9b067; --c-veg: #6fb38f;
  --c-herb: #93c06b; --c-fruit: #dd9cc8; --c-grain: #cba076; --c-season: #d6ad62; --c-other: #98a89e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) 120px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
/* Home-screen app: iOS blurs a band below the status bar, deeper than the safe area */
@media (display-mode: standalone) {
  .app { padding-top: calc(36px + env(safe-area-inset-top, 0px)); }
}

/* Header */
.head { display: flex; flex-direction: column; gap: 4px; }
.head .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head .ttl { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; min-width: 0; }
.head h1 { margin: 0; font-family: var(--font-head); font-size: 28px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.head h1 .num { font-family: var(--font-head); font-style: italic; }
.head .sub { margin: 0; white-space: nowrap; font-size: 13px; font-weight: 500; color: var(--ink-muted); }
.head .logo { display: block; align-self: center; height: 38px; width: auto; color: var(--brand); }
.sync {
  width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink); cursor: pointer;
  transition: transform 140ms var(--ease-out);
}
.sync:active { transform: scale(0.94); }
.sync svg { width: 18px; height: 18px; }
.sync.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Notice banner */
.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: var(--radius-card);
  background: var(--accent-light); color: var(--ink); font-size: 14px;
}
.notice .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
.notice p { margin: 0; }
.notice button {
  margin-top: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px;
  border: 0; background: var(--accent-ink); color: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer;
}

/* Card surface: borderless white, soft shadow */
.card {
  position: relative;
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

/* Hero: the one green card — the quickest menu that is ready now, with a ring of ready / all menus. Flat, no decoration. */
.hero {
  position: relative; display: block; width: 100%;
  padding: 20px; border: 0; border-radius: var(--radius-card); color: var(--on-brand); text-align: left; cursor: pointer;
  background: var(--brand);
  transition: transform 140ms var(--ease-out);
}
.hero:active { transform: scale(0.985); }
.hero.static { cursor: default; }
.hero.static:active { transform: none; }
.hero .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero .txt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.hero .kicker {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px;
  border-radius: 999px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-brand) 55%, transparent); font-size: 12px; font-weight: 600;
}
.hero .kicker svg { width: 14px; height: 14px; }
.hero .title { margin-top: 12px; font-family: var(--font-head); font-size: 28px; line-height: 1.35; font-weight: 600; text-wrap: balance; }
.hero .meta { margin-top: 2px; font-size: 13px; }
.hero .ring { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; white-space: nowrap; }
.hero .ring .rw { position: relative; width: 64px; height: 64px; }
.hero .ring svg { display: block; width: 64px; height: 64px; transform: rotate(-90deg); }
.hero .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-head); font-style: italic; font-size: 24px; font-weight: 600; }
.hero .cta {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px 0 20px;
  border-radius: 999px; background: var(--bg); color: var(--ink); font-size: 15px; font-weight: 600;
}
.hero .cta svg { width: 16px; height: 16px; }
/* Pantry version: one row — how many picked, and a button over to the menus */
.hero.summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 20px; }
.hero.summary .title, .hero.summary .meta { margin-top: 0; }
.hero.summary .title { font-size: 24px; }
.hero.summary .title .num { font-family: var(--font-head); font-style: italic; }
.hero.summary .cta { margin-top: 0; flex-shrink: 0; }

/* Tabs with counts: ทำได้เลย / ขาดอีกนิด / ทั้งหมด — underline, big italic serif numbers */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.seg button {
  position: relative; min-width: 0; min-height: 60px; padding: 0 2px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; white-space: nowrap;
  border: 0; background: transparent; color: var(--ink-muted); font-size: 13px; font-weight: 500; cursor: pointer;
}
.seg button .n { font-family: var(--font-head); font-style: italic; font-size: 26px; font-weight: 600; line-height: 1; color: var(--ink-muted); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.seg button[aria-pressed="true"] .n { color: var(--brand); }
.seg button[aria-pressed="true"][data-tab="almost"] .n { color: var(--accent-ink); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 14px; bottom: -1px; height: 2px; background: var(--ink); }
.cnt {
  min-width: 24px; height: 22px; padding: 0 7px; box-sizing: border-box; display: inline-grid; place-items: center;
  border-radius: 999px; font-family: var(--font-num); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.cnt.ready { background: var(--primary-light); color: var(--primary-dark); }
.cnt.almost { background: var(--accent-light); color: var(--accent-ink); }
.cnt:not(.ready):not(.almost) { background: var(--line-soft); color: var(--ink-muted); }

/* View container */
.view { display: flex; flex-direction: column; gap: 16px; }
.view.from-right { animation: inR 240ms var(--ease-out); }
.view.from-left { animation: inL 240ms var(--ease-out); }
@keyframes inR { from { opacity: 0; transform: translateX(22px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-22px); } }

/* Search */
.search {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 46px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line-soft);
}
.search svg { width: 18px; height: 18px; color: var(--ink-faint); flex-shrink: 0; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font: inherit; color: var(--ink);
}
.search input::placeholder { color: var(--ink-faint); }
.search:focus-within { border-color: var(--brand); }

.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.picked { font-size: 13px; color: var(--ink-muted); }
.link-btn {
  border: 0; background: none; padding: 4px 2px; cursor: pointer;
  font-size: 13px; color: var(--primary-dark); font-weight: 600;
}
.link-btn:disabled { color: var(--ink-faint); cursor: default; }

/* Ingredient groups */
.group { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.group h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.group h2 .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.group h2 .count { margin-left: auto; font-family: var(--font-num); font-size: 12px; color: var(--ink-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 999px;
  border: 0; background: var(--chip);
  font-size: 15px; cursor: pointer;
  transition: transform 140ms var(--ease-out), background-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
}
.chip:active { transform: scale(0.95); }
.chip .tick {
  width: 14px; height: 14px; margin-left: -2px; display: none;
}
.chip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent);
  font-weight: 600;
}
.chip[aria-pressed="true"] .tick { display: block; color: var(--c); }
.chip:focus-visible, .menu-card:focus-visible, .nav button:focus-visible, .filter:focus-visible, .sync:focus-visible, .hero:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* Pantry: only what is in the kitchen now (× when it runs out), new things come from the add sheet */
.chip.have {
  gap: 8px; padding: 8px 12px 8px 16px; font-weight: 600;
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent);
}
.chip.have svg { width: 14px; height: 14px; opacity: 0.55; }
/* counted kitchen item: "ไข่ไก่ [4 ฟอง] ×"; press and hold opens the count sheet, so no text-selection callout */
.chip.have[data-hold] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.qty-badge {
  padding: 0 8px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 12px; font-weight: 700; line-height: 22px; color: var(--ink);
}
.chip.add { gap: 6px; padding: 8px 16px 8px 12px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
.chip.add svg { width: 14px; height: 14px; }
.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
  box-shadow: 0 10px 22px -10px rgba(11, 61, 66, 0.6);
  transition: transform 140ms var(--ease-out);
}
.add-btn:active { transform: scale(0.98); }
.add-btn svg { width: 18px; height: 18px; }
.quick { display: flex; flex-direction: column; gap: 8px; }
.quick p { margin: 0 4px; font-size: 13px; font-weight: 500; color: var(--ink-muted); }

/* Add sheet: one collapsible card per ingredient type */
.sheet.add { height: 88%; background: var(--bg); }
.add-head { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 20px 12px; }
.add-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.add-head h2 { margin: 0; font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.add-head .link-btn { min-height: 44px; font-size: 14px; }
.sheet.add .scroll { flex: 1; min-height: 0; padding-top: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.asec { flex-shrink: 0; overflow: hidden; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card); }
.asec-head {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px;
  border: 0; background: transparent; text-align: left; cursor: pointer;
}
.asec-head .cdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.asec-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.asec-head b { font-size: 16px; font-weight: 700; }
.asec-head small { font-size: 13px; font-weight: 600; color: var(--brand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asec-head .count { font-size: 13px; color: var(--ink-muted); }
.asec-head .chev { width: 18px; height: 18px; flex-shrink: 0; color: var(--ink-faint); transition: transform 200ms var(--ease-out); }
.asec-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.asec-all { padding: 0 8px; border-top: 1px solid var(--line-soft); }
.asec-all .link-btn { min-height: 44px; padding: 0 8px; font-size: 14px; }
.arow {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px;
  border: 0; border-top: 1px solid var(--line-soft); background: transparent;
  text-align: left; font-size: 16px; cursor: pointer;
}
.arow .n { flex: 1; min-width: 0; }
.arow .note { font-size: 13px; color: var(--ink-muted); }
.arow .box {
  width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center;
  border-radius: 9px; border: 2px solid var(--ink-faint); color: var(--surface);
}
.arow .box svg { width: 15px; height: 15px; display: none; }
.arow[aria-pressed="true"] .box { background: var(--c); border-color: var(--c); }
.arow[aria-pressed="true"] .box svg { display: block; }
.arow:disabled { cursor: default; opacity: 0.7; }
.arow:disabled .box { background: var(--ink-faint); border-color: var(--ink-faint); }
.add-none { margin: 32px 8px; text-align: center; font-size: 14px; color: var(--ink-muted); }
.add-foot {
  flex-shrink: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line-soft);
}
.add-foot button {
  width: 100%; min-height: 52px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
}
.add-btn:focus-visible, .asec-head:focus-visible, .arow:focus-visible, .add-foot button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* Filters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: -2px -2px -6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0;
  background: transparent; box-shadow: inset 0 0 0 1px var(--line);
  font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.filter .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: none; }

/* Menu sections */
.section-head { display: flex; align-items: center; gap: 8px; margin: 6px 4px -6px; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.section-head .count {
  min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
  font-family: var(--font-num); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.section-head.ready .count { background: var(--primary-light); color: var(--primary-dark); }
.section-head.almost .count { background: var(--accent-light); color: var(--accent-ink); }

/* Chapter divider above a list: hairline — ◆ label ◆ — hairline */
.chapter { display: flex; align-items: center; gap: 10px; margin: 2px 0 -6px; font-family: var(--font-head); font-style: italic; font-size: 15px; font-weight: 500; color: var(--ink-muted); }
.chapter::before, .chapter::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chapter i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--brand); flex-shrink: 0; }

/* Menu rows: one grouped card, each row = open button (ring · name · meta) + optional "+ ซื้อ" */
.list { overflow: hidden; }
.menu-row { position: relative; display: flex; align-items: center; padding-right: 12px; }
.menu-row + .menu-row::before {
  content: ""; position: absolute; top: 0; left: 74px; right: 0; height: 1px; background: var(--line-soft);
}
.menu-card {
  position: relative; flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 14px;
  min-height: 76px; padding: 14px 4px 14px 16px; border: 0; background: transparent;
  text-align: left; cursor: pointer;
  transition: background-color 140ms var(--ease-out);
}
.menu-card:active { background: var(--line-soft); }
.menu-card .ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
.menu-card .ring svg { display: block; width: 44px; height: 44px; transform: rotate(-90deg); }
.menu-card .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.menu-row.ready .ring b { color: var(--brand); }
.menu-row.almost .ring b { color: var(--accent-ink); }
.menu-row.far .ring b { color: var(--ink-muted); }
.stamp { display: inline-block; padding: 0 6px; border: 1px solid var(--ink); border-radius: 3px; font-size: 11px; font-weight: 600; line-height: 18px; color: var(--ink); }
.add-mini {
  flex-shrink: 0; min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent-light); color: var(--accent-ink); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.add-mini[aria-pressed="true"] { background: var(--chip); color: var(--ink-muted); }
.add-mini:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.menu-card .body { flex: 1; min-width: 0; }
.menu-card .body { display: flex; flex-direction: column; }
.menu-card .name { font-weight: 600; font-size: 16px; line-height: 1.35; }
.menu-card .meta { font-size: 13px; color: var(--ink-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.menu-card .meta span { display: inline-flex; align-items: center; gap: 4px; }
.menu-card .meta svg { width: 12px; height: 12px; }
.menu-card .need { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted); }
.menu-card .need .miss {
  padding: 1px 10px; border-radius: 999px; font-weight: 500;
  background: var(--accent-light); color: var(--accent-ink);
}
.menu-card .swap { margin-top: 6px; font-size: 12.5px; color: var(--ink-muted); }
.menu-card .chev { width: 16px; height: 16px; color: var(--ink-faint); flex-shrink: 0; }

.empty {
  padding: 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty.big { padding: 40px 24px 32px; border-radius: 28px; gap: 10px; }
.empty .art {
  width: 120px; height: 120px; margin-bottom: 10px; border-radius: 50%;
  display: grid; place-items: center; background: var(--track); color: var(--brand);
}
.empty .art svg { width: 64px; height: 64px; }
.empty h3 { margin: 0; font-family: var(--font-head); font-size: 19px; font-weight: 600; }
.empty.big h3 { font-size: 24px; }
.empty p { margin: 0; font-size: 14px; color: var(--ink-muted); max-width: 32ch; }
.empty button {
  margin-top: 6px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px;
  background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 600; cursor: pointer;
}
.foot { margin: 0 8px; text-align: center; font-size: 13px; color: var(--ink-muted); }
/* Far-away menus (search only), shopping list, "buy to unlock" */
.section-head.far .count { background: var(--line-soft); color: var(--ink-muted); }
.tool { padding: 14px 16px 6px; display: flex; flex-direction: column; }
.tool.unlock { background: var(--accent-light); box-shadow: none; }
.tool.unlock .tool-head h2, .tool.unlock .tool-row .t b { color: var(--ink); }
.tool.unlock .tool-sub, .tool.unlock .tool-row .t small { color: var(--accent-ink); }
.tool.unlock .tool-row { border-top-color: color-mix(in srgb, var(--accent-ink) 18%, transparent); }
.tool.unlock .pill-btn { background: var(--accent-ink); color: var(--surface); }
.tool.unlock .pill-btn.ghost { background: var(--surface); color: var(--accent-ink); }
.tool-row .gain { flex-shrink: 0; padding: 2px 8px; border-radius: 8px; background: var(--accent-light); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
.tool-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tool-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-size: 19px; font-weight: 600; }
.tool-sub { margin: 2px 0 8px; font-size: 13px; color: var(--ink-muted); }
.tool-row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0;
  border: 0; border-top: 1px solid var(--line-soft); background: transparent;
  font: inherit; color: inherit; text-align: left;
}
.tool-row .t { flex: 1; min-width: 0; }
.tool-row .t b { display: block; font-size: 15px; font-weight: 600; }
.tool-row .t b .q { font-weight: 400; color: var(--ink-muted); }
.tool-row .t small { display: block; margin-top: 1px; font-size: 13px; line-height: 1.5; color: var(--ink-muted); }
.tool-row { min-height: 56px; }
.tool-row.shop { cursor: pointer; }
.tool-row.shop .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); flex-shrink: 0; }
.tool-row.shop .box { display: grid; place-items: center; color: transparent; }
.tool-row.shop .box svg { width: 16px; height: 16px; }
.tool-row.shop.done .box { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.tool-row.shop.done .t b { color: var(--ink-faint); text-decoration: line-through; }
.tool-row.shop.done .t small { color: var(--ink-faint); }
.tool-row.shop.done .gain { background: var(--track); color: var(--ink-faint); }
.shop-done { margin: 10px 0 10px; }
.pill-btn {
  flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ink); color: var(--bg); font: inherit; font-size: 14px; font-weight: 600;
}
.pill-btn svg { width: 14px; height: 14px; }
.pill-btn.ghost { background: var(--track); color: var(--ink); }
.pill-btn:disabled { background: var(--line-soft); color: var(--ink-faint); cursor: default; }
.pill-btn.wide { width: 100%; padding: 12px; font-size: 15px; }
.pill-btn:focus-visible, .tool-row.shop:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.skeleton { height: 64px; border-radius: var(--radius-card); background: var(--line-soft); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

/* Floating nav capsule: dark, the current page is a cream pill */
.nav {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--nav-bg);
  box-shadow: var(--shadow-nav);
  z-index: 20;
}
.nav button {
  position: relative; display: flex; align-items: center; gap: 6px;
  min-height: 48px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent;
  font-size: 14px; font-weight: 500; color: var(--nav-ink); cursor: pointer; white-space: nowrap;
  transition: background-color 180ms var(--ease-out), color 180ms var(--ease-out);
}
.nav button svg { width: 20px; height: 20px; }
.nav button[aria-current="page"] { background: var(--bg); color: var(--ink); font-weight: 700; }
.nav button[aria-current="page"] svg { color: var(--brand); }
.nav .pill {
  min-width: 22px; padding: 0 6px; height: 20px; box-sizing: border-box; border-radius: 999px;
  display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; font-weight: 700;
  background: color-mix(in srgb, var(--nav-ink) 22%, transparent); color: inherit;
}
.nav button[aria-current="page"] .pill { background: var(--primary-light); color: var(--primary-dark); }
.nav .pill.alert { background: var(--accent); color: #fff; }
.nav .pill:empty { display: none; }
/* only the current page shows its word; the others keep it for screen readers */
.nav button:not([aria-current="page"]) .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Undo toast (pantry ×) */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 21;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 32px), 420px); display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px;
}
.toast[hidden] { display: none; }
.toast span { flex: 1; min-width: 0; }
.toast button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--bg) 18%, transparent); color: inherit; font-weight: 600; cursor: pointer; }

/* Detail sheet */
.scrim {
  position: fixed; inset: 0; background: var(--scrim); z-index: 30;
  opacity: 0; transition: opacity 220ms var(--ease-out);
}
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
  max-width: 560px; margin: 0 auto; max-height: 88%;
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 24px 24px 0 0;
  box-shadow: 0 -12px 32px -12px rgba(0, 0, 0, 0.25);
  transform: translateY(100%); transition: transform 300ms var(--ease-out);
}
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; flex-shrink: 0; }
.sheet .scroll {
  overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.sheet#sheet { background: var(--bg); }
.sheet#sheet .grab { position: absolute; left: 0; right: 0; top: 0; z-index: 1; background: color-mix(in srgb, var(--on-brand) 45%, transparent); }
/* Recipe header: flat green block, serif title, three-slot facts bar */
.dhead {
  margin: -12px calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0;
  padding: 26px max(20px, env(safe-area-inset-left, 0px)) 18px;
  background: var(--brand); color: var(--on-brand); border-radius: 24px 24px 24px 24px;
  display: flex; flex-direction: column; gap: 10px;
}
.dhead .folio { font-family: var(--font-head); font-style: italic; font-size: 14px; opacity: 0.85; }
.sheet h2 { margin: 0; font-family: var(--font-head); font-size: 30px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.sheet .status { align-self: flex-start; display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bg); }
.sheet .status.ready { color: var(--brand); }
.sheet .status.almost, .sheet .status.far { color: var(--accent-ink); }
.sheet .facts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 4px; border-top: 1px solid color-mix(in srgb, var(--on-brand) 40%, transparent); }
.sheet .fact { padding: 10px 0 0 12px; min-width: 0; }
.sheet .fact:first-child { padding-left: 0; }
.sheet .fact + .fact { border-left: 1px solid color-mix(in srgb, var(--on-brand) 40%, transparent); }
.sheet .fact small { display: block; font-size: 11.5px; opacity: 0.85; }
.sheet .fact b { display: block; font-family: var(--font-head); font-style: italic; font-size: 19px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .fact b .num { font-family: inherit; }
.sheet h3 { margin: 0 0 8px; display: flex; align-items: baseline; justify-content: space-between; font-family: var(--font-head); font-size: 19px; font-weight: 600; color: var(--ink); }
.sheet h3 small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--ink-muted); }
/* Ingredients like a cookbook: status box · name ········ amount */
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li:last-child { border-bottom: 0; }
.ing-list li {
  display: flex; gap: 10px; align-items: center;
  min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--line-soft);
}
.ing-list .st { width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center; border-radius: 8px; }
.ing-list .st svg { width: 14px; height: 14px; }
.ing-list .have .st { background: var(--brand); color: var(--on-brand); }
.ing-list .swap .st { background: var(--sub-bg); color: var(--sub-ink); }
.ing-list .miss .st { background: var(--accent-light); color: var(--accent-ink); }
.ing-list .skip .st { background: var(--chip); color: var(--ink-muted); }
.ing-list .skip .n { color: var(--ink-muted); }
.ing-list .n { flex: 0 1 auto; min-width: 0; max-width: 60%; }
.ing-list .ld { flex: 1; min-width: 16px; height: 0; margin-top: 6px; border-bottom: 2px dotted var(--line); }
.ing-list .sub { display: block; font-size: 12px; color: var(--ink-muted); }
.ing-list .swap .sub { color: var(--sub-ink); font-weight: 500; }
.ing-list .miss .sub { color: var(--accent-ink); }
.ing-list .q { font-family: var(--font-head); font-style: italic; font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.steps { margin: 0; white-space: pre-line; font-size: 15px; line-height: 1.7; }
.step-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step-list li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; line-height: 1.7; }
.step-list li:last-child { border-bottom: 0; }
.step-list .no { font-family: var(--font-head); font-style: italic; font-size: 30px; font-weight: 600; line-height: 1; color: var(--brand); }
.src {
  display: inline-flex; align-items: center; gap: 6px; color: var(--primary-dark); font-weight: 600;
  text-decoration: none; word-break: break-all;
}
.src svg { width: 14px; height: 14px; flex-shrink: 0; }
.note { margin: 0; font-size: 14px; color: var(--ink-muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 11px; border-radius: 999px; background: var(--line-soft); font-size: 12px; color: var(--ink-muted); }
/* Status box in the ingredient list = toggle "มีในครัว" (44px tap area around the 24px box) */
.ing-list button.st { position: relative; border: 0; padding: 0; font: inherit; cursor: pointer; color: inherit; }
.ing-list button.st::after { content: ""; position: absolute; inset: -10px; }
.ing-list button.st:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.dtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dedit {
  min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
  background: transparent; color: var(--on-brand); border: 1px solid color-mix(in srgb, var(--on-brand) 55%, transparent);
}
.dedit:focus-visible { outline: 2px solid var(--on-brand); outline-offset: 2px; }
/* Count sheet (press and hold a kitchen chip) */
.sheet.count { z-index: 32; }
.sheet.count h2 { margin: 0; font-family: var(--font-head); font-size: 24px; font-weight: 600; line-height: 1.35; }
.crow {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 52px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
}
.crow small { display: block; font-size: 12px; color: var(--ink-muted); }
.crow input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--brand); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
.stepper button {
  width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 50%; background: var(--track); color: var(--ink);
  font-size: 22px; font-weight: 600; cursor: pointer;
}
.stepper button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.stepper .sv { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--ink-muted); }
.sheet .stepper .sv input {
  width: 110px; min-height: 0; padding: 0; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent;
  text-align: center; font-family: var(--font-head); font-style: italic; font-size: 40px; font-weight: 600; line-height: 1.2;
}
.sheet .stepper .sv input:focus { outline: 0; border-bottom-color: var(--brand); }
.stepper.sm { gap: 6px; }
.stepper.sm button { width: 40px; height: 40px; font-size: 18px; }
.stepper.sm b { min-width: 64px; text-align: center; font-family: var(--font-head); font-style: italic; font-size: 17px; font-weight: 600; }
.units { justify-content: center; }
/* ทำแล้ว */
.cook-btn, .cook-foot .pill-btn:last-child { gap: 8px; background: var(--brand); color: var(--on-brand); }
.cook-btn svg { width: 18px; height: 18px; }
.ehdr .folio { font-family: var(--font-head); font-style: italic; font-size: 14px; color: var(--ink-muted); }
.ehdr h2 { font-size: 26px; }
.cook-list { list-style: none; margin: 0; padding: 0; }
.cook-row { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.cook-row:last-child { border-bottom: 0; }
.cook-row .n { flex: 1; min-width: 0; }
.cook-row .n small { display: block; font-size: 12px; color: var(--ink-muted); }
.seg2 { display: flex; flex-shrink: 0; padding: 3px; border-radius: 999px; background: var(--track); }
.seg2 button {
  min-height: 38px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent;
  color: var(--ink-muted); font-size: 13px; font-weight: 500; cursor: pointer;
}
.seg2 button[aria-pressed="true"][data-v="1"] { background: var(--accent-light); color: var(--accent-ink); font-weight: 600; }
.seg2 button[aria-pressed="true"][data-v="0"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.seg2 button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.cook-foot { display: flex; gap: 10px; }
.cook-foot .pill-btn { min-height: 48px; padding: 0 20px; font-size: 15px; }
.cook-foot .pill-btn:last-child { flex: 1; }
/* Recipe editor: the recipe page itself becomes editable — tap a thing to edit just that thing */
.ehdr { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; }
.ehdr p { margin: 0; font-size: 13px; color: var(--ink-muted); }
.sheet input:not([type="checkbox"]), .sheet select, .sheet textarea {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; font-weight: 400;
}
.sheet textarea { resize: vertical; line-height: 1.6; }
.sheet input:focus-visible, .sheet select:focus-visible, .sheet textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
.dhead.editing { background: color-mix(in srgb, var(--brand) 88%, var(--ink)); }
.ename-btn, .fact.ed { border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ename-btn { padding: 0; align-self: flex-start; max-width: 100%; }
.ename-btn h2, .fact.ed b { text-decoration: underline dashed color-mix(in srgb, var(--on-brand) 55%, transparent); text-decoration-thickness: 1px; text-underline-offset: 6px; }
.ename-btn:focus-visible, .fact.ed:focus-visible { outline: 2px solid var(--on-brand); outline-offset: 2px; border-radius: 8px; }
.dhead input.ename { font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.fact.on { padding-bottom: 2px; }
.fact.on input, .fact.on select { min-height: 40px; margin-top: 4px; padding: 4px 8px; font-size: 16px; }
.ing-list.editing li { gap: 6px; }
.ing-list .ebtn { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ing-list .ebtn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
.ing-list .erow.open { border-bottom: 0; }
.ing-list .erow.open .n { font-weight: 600; }
.ing-list .changed .sub { color: var(--brand); font-weight: 500; }
.ing-list li.gone .n { color: var(--ink-faint); text-decoration: line-through; }
.ing-list li.gone .sub { color: var(--accent-ink); text-decoration: none; display: block; }
.ing-list li.gone .link-btn { min-height: 44px; font-size: 14px; }
.ex { width: 44px; height: 44px; margin-right: -10px; flex-shrink: 0; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ink-faint); cursor: pointer; }
.ex svg { width: 15px; height: 15px; }
.ing-list li.epanel { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 4px 0 14px; }
.ing-list li.epanel .link-btn { align-self: flex-end; min-height: 40px; font-size: 14px; }
.epair { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.echeck { display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; color: var(--ink); cursor: pointer; }
.echeck input { width: 20px; height: 20px; accent-color: var(--brand); }
.esub { display: flex; align-items: center; gap: 10px; }
.esub span { flex-shrink: 0; font-size: 14px; color: var(--ink-muted); }
.ing-list li.eaddrow { border-bottom: 0; padding-top: 4px; }
.eadd-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px dashed var(--line); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.eadd-btn svg { width: 14px; height: 14px; }
.eadd { display: flex; gap: 8px; width: 100%; }
.link-btn.sm { min-height: 36px; padding: 0 4px; font-family: var(--font-body); font-size: 14px; }
.ehint { margin: 6px 4px 0; font-size: 12px; color: var(--ink-faint); }
.eerr { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--accent-light); color: var(--accent-ink); font-size: 14px; }
.eerr .link-btn { color: inherit; text-decoration: underline; }
.ebar { display: flex; align-items: center; gap: 10px; position: sticky; bottom: 0; margin-top: auto; padding: 8px 8px 8px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-nav); }
.ebar[hidden] { display: none; }
.ebar .ecount { flex: 1; font-size: 14px; font-weight: 600; }
.ebar .pill-btn { min-height: 44px; padding: 0 22px; background: var(--brand); color: var(--on-brand); }
.ebar.two { padding: 8px 0 0; border-radius: 0; background: linear-gradient(transparent, var(--bg) 30%); box-shadow: none; }
.ebar.two .pill-btn { flex: 1; min-height: 48px; font-size: 15px; background: var(--ink); color: var(--bg); }
.ebar.two .pill-btn.ghost { background: var(--track); color: var(--ink); }
.diff { list-style: none; margin: 0; padding: 0; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-card); }
.diff li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.diff li:last-child { border-bottom: 0; }
.diff b { flex-basis: 100%; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.diff .from { color: var(--ink-muted); text-decoration: line-through; white-space: pre-line; }
.diff .to { color: var(--ink); font-weight: 600; white-space: pre-line; }
.diff .arr { color: var(--ink-faint); }
.diff .del b, .diff .del .from { color: var(--accent-ink); }
.diff .add b { color: var(--brand); }
.diff i { font-style: normal; color: var(--ink-faint); }
.diff .long .from, .diff .long .to { flex-basis: 100%; }
.diff .long .arr { display: none; }

/* Google sign-in screen (covers everything until there is a live ID token) */
.login {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 24px 16px; text-align: center; overflow: hidden;
}
.login[hidden] { display: none; }
.login img { width: 96px; height: 96px; border-radius: 28px; }
.login h2 { margin: 8px 0 0; font-family: var(--font-head); font-size: 34px; font-weight: 600; line-height: 1.35; }
.login p { margin: 0; max-width: 300px; font-size: 14px; color: var(--ink-muted); }
.login #gbtn { min-height: 44px; margin-top: 6px; }

@media (prefers-reduced-motion: reduce) {
  .view.from-right, .view.from-left, .sync.spin svg, .skeleton { animation: none; }
  .sheet, .scrim { transition: opacity 150ms linear; }
  .sheet { transform: none; opacity: 0; }
  .sheet.open { opacity: 1; }
  .chip, .menu-card, .sync, .hero { transition: none; }
  .chip:active, .menu-card:active, .sync:active, .hero:active { transform: none; }
}
</style>
